<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<title>Papers</title>
<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#14161B; --surface:#1C1F26; --raised:#242832; --ink:#E7E9EE; --muted:#8B919E; --faint:#2C303A;
  --accent:#9DB2FF; --star:#E6C170; --danger:#F28B82;
  --font:"Manrope",system-ui,Roboto,"Segoe UI",sans-serif;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}

header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}
h1 .n{font-weight:400;color:var(--muted);font-size:1rem;margin-left:6px}
.hbtns{display:flex;gap:4px;position:relative}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);display:grid;place-items:center;font-size:1.1rem}
.ibtn:active{background:var(--surface)}
.menu{position:absolute;right:0;top:48px;background:var(--raised);border-radius:12px;padding:6px;min-width:190px;display:none;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}
.menu button:active{background:var(--faint)}

.search{width:100%;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;min-height:48px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 14px;min-height:38px;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip .c{opacity:.7;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.add{color:var(--accent)}

.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;color:var(--muted);font-size:.85rem}
.bar select{background:transparent;border:0;color:var(--muted);padding:6px 0;min-height:40px}
.bar .edit{color:var(--accent);min-height:40px;padding:0 4px}

.list{display:flex;flex-direction:column;gap:8px}
.paper{background:var(--surface);border-radius:14px;padding:14px 8px 8px 16px}
.paper h3{font-size:1rem;font-weight:500;margin:0 8px 0 0;overflow-wrap:anywhere}
.doi{display:block;margin-top:4px;color:var(--accent);font-size:.85rem;text-decoration:none;overflow-wrap:anywhere;padding:2px 0}
.pmeta{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.coll{font-size:.8rem;color:var(--muted)}
.pbtns{display:flex}
.pbtns .ibtn{min-width:40px;min-height:40px;font-size:1rem}
.star-on{color:var(--star)}
.empty{color:var(--muted);text-align:center;padding:48px 16px}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--accent);color:#14161B;font-size:1.8rem;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:4}

dialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:90vh}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
.sheet input,.sheet select{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%}
.hint{font-size:.8rem;color:var(--danger);min-height:1em;margin:-6px 0 0}
.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.btn{border-radius:12px;padding:12px 16px;min-height:48px}
.btn.primary{background:var(--accent);color:#14161B;font-weight:700}
.btn.ghost{color:var(--muted)}
.btn.danger{color:var(--danger)}
.clist{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:6px;align-items:center}
.crow input{flex:1}
.crow .ibtn{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}
.toast.show{opacity:1}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---- Theme: dark with pink-to-blue accents ---- */
:root{
  --bg:#000000;--surface:#131316;--raised:#1D1D22;--ink:#F2F2F4;--muted:#9D9DA5;--faint:#28282E;
  --accent:#EBA8E4;--accent2:#A7CBF4;
  --grad:linear-gradient(90deg,#F0A8DC 0%,#C9B6EF 50%,#A6CCF5 100%);
  --danger:#EF5A50;--star:#EBA8E4;--pinbg:#2A2413;
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{background-color:#000;background-image:linear-gradient(172deg,#5A4360 0%,#352C3F 90px,#15121A 210px,#000 320px);background-repeat:no-repeat;background-size:100% 340px}
h1{font-weight:500;font-size:1.85rem;letter-spacing:0}
h1 .n{font-size:1rem}
.search{background:#0E0E11;border:1.5px solid #2E2E35;border-radius:999px}
.search:focus{border-color:#9C8BC0;outline:none}
.chip{background:#000;border:1.5px solid #3B3B43;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#17161C;font-weight:500}
.chip.add{color:var(--accent)}
.tab[aria-selected="true"]::after{background:var(--grad)}
.btn.primary,.add{background:var(--grad)!important;color:#17161C!important}
.fab{background:#17171C;border:1px solid #3A3A42;color:#D9B9EE;box-shadow:0 8px 22px rgba(0,0,0,.7)}
.star-on{color:var(--star)!important}
.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}
.menu{background:var(--raised);border:1px solid #2E2E35}
dialog{background:var(--raised)}
.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:#0F0F12}
.toast{background:#26262C;color:var(--ink)}
.doi{color:var(--accent2)}
.sync{color:#6F6F77}
.seg button[aria-pressed="true"]{background:var(--grad);color:#17161C}
.topbar{background:linear-gradient(172deg,#5A4360 0%,#2A2432 100%)}
.toolbar{background:#000}
.bk.hidden{display:none!important}
.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,#2A2413);border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}
.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}
.bk .bkt b{display:block;font-weight:500}
.bk .bkt span{color:var(--muted);font-size:.8rem}
.bk .bkgo{background:var(--grad);color:#17161C;border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}
.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Papers<span class="n" id="total"></span></h1>
    <div class="hbtns">
      <button class="ibtn" id="moreBtn" aria-label="More options" aria-expanded="false">⋮</button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="collBtn">Manage collections</button>
        <button role="menuitem" id="csvBtn">Export as CSV</button>
        <button role="menuitem" id="exportBtn">Export backup</button>
        <button role="menuitem" id="importBtn">Import backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <label class="sr" for="search">Search papers</label>
  <input class="search" id="search" type="search" placeholder="Search title or DOI">
  <div class="chips" id="chips"></div>

  <div class="bar">
    <span id="count"></span>
    <label><span class="sr">Sort</span>
      <select id="sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="az">Title A to Z</option>
        <option value="star">Starred first</option>
      </select>
    </label>
  </div>

  <main class="list" id="list"></main>
  <p class="sync" id="sync"></p>
</div>

<button class="fab" id="fab" aria-label="Add paper">+</button>

<dialog id="dlg">
  <form class="sheet" id="form" autocomplete="off" novalidate>
    <h2 id="dlgTitle">Add paper</h2>
    <label>Title<input id="fTitle" maxlength="400" required></label>
    <label>DOI<input id="fDoi" maxlength="300" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="10.1021/acscatal..."></label>
    <p class="hint" id="hint"></p>
    <label>Collection<select id="fColl"></select></label>
    <div class="sbar">
      <button type="button" class="btn danger" id="delBtn">Delete</button>
      <span style="display:flex;gap:6px;margin-left:auto">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
      </span>
    </div>
  </form>
</dialog>

<dialog id="cdlg">
  <div class="sheet">
    <h2>Collections</h2>
    <div class="clist" id="clist"></div>
    <div class="crow">
      <label class="sr" for="newColl">New collection</label>
      <input id="newColl" placeholder="New collection" maxlength="60">
      <button class="btn primary" id="addColl">Add</button>
    </div>
    <div class="sbar"><span></span><button class="btn primary" id="cDone">Done</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  function offlineSave(filename,data){
    try{
      const ext=(filename.split(".").pop()||"").toLowerCase();
      const type={json:"application/json",csv:"text/csv",md:"text/markdown",png:"image/png"}[ext]||"text/plain";
      const blob=data instanceof Blob?data:new Blob([data],{type:type+";charset=utf-8"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download=filename;a.style.display="none";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      toast("Saved to Downloads");if(/\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();
    }catch(_){toast("Couldn't save the file")}
  }
  function storageWorks(){try{const k="__probe"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(_){return false}}
  const STORAGE_MSG=()=>storageWorks()?"Saved on this phone. Export a backup now and then.":"Storage is blocked here, so changes will be lost when you close this page.";
  const LS_KEY="paperlib.v1";
  let state={papers:[],collections:[]};
  let filter="all", query="", sortBy="new", editingId=null;

  const $=s=>document.querySelector(s);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  // DOI helpers: accept "10.x/...", "doi:10.x/...", "https://doi.org/10.x/..."
  function normDoi(s){
    s=String(s||"").trim().replace(/^doi:\s*/i,"").replace(/^https?:\/\/(dx\.)?doi\.org\//i,"");
    try{s=decodeURIComponent(s)}catch(_){}
    return s.trim();
  }
  const validDoi=d=>/^10\.\d{4,9}\/\S+$/.test(d);
  const doiUrl=d=>"https://doi.org/"+encodeURI(d);

  // toast
  let tt=null;
  function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2400)}

  // storage
  function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
  function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){toast("Couldn\'t save. Storage is full or blocked; export a backup.")}}
  function persist(){saveLocal()}

  // render
  const collName=id=>(state.collections.find(c=>c.id===id)||{}).name||"";
  function visible(p){
    if(filter==="star"&&!p.star) return false;
    if(filter==="none"&&p.coll) return false;
    if(filter!=="all"&&filter!=="star"&&filter!=="none"&&p.coll!==filter) return false;
    if(!query) return true;
    return (p.title+" "+p.doi).toLowerCase().includes(query);
  }
  function sorted(list){
    const l=[...list];
    if(sortBy==="new") l.sort((a,b)=>b.added-a.added);
    else if(sortBy==="old") l.sort((a,b)=>a.added-b.added);
    else if(sortBy==="az") l.sort((a,b)=>a.title.localeCompare(b.title,undefined,{sensitivity:"base"}));
    else l.sort((a,b)=>(b.star?1:0)-(a.star?1:0)||b.added-a.added);
    return l;
  }
  function renderChips(){
    const P=state.papers;
    const items=[
      {id:"all",name:"All",n:P.length},
      {id:"star",name:"★ Starred",n:P.filter(p=>p.star).length},
      ...state.collections.map(c=>({id:c.id,name:c.name,n:P.filter(p=>p.coll===c.id).length})),
      {id:"none",name:"Unsorted",n:P.filter(p=>!p.coll).length}
    ];
    $("#chips").innerHTML=items.map(i=>`<button class="chip" data-f="${i.id}" aria-pressed="${filter===i.id}">${esc(i.name)}<span class="c">${i.n}</span></button>`).join("")
      +`<button class="chip add" id="chipAdd">+ Collection</button>`;
  }
  function render(){
    if(filter!=="all"&&filter!=="star"&&filter!=="none"&&!state.collections.some(c=>c.id===filter)) filter="all";
    renderChips();
    $("#total").textContent=state.papers.length||"";
    const list=sorted(state.papers.filter(visible));
    $("#count").textContent=`${list.length} paper${list.length===1?"":"s"}`;
    if(!list.length){
      $("#list").innerHTML=`<div class="empty">${state.papers.length?"No papers match.":"Tap + to save your first paper."}</div>`;
      return;
    }
    $("#list").innerHTML=list.map(p=>`<article class="paper" data-id="${p.id}">
      <h3>${esc(p.title)}</h3>
      ${p.doi?`<a class="doi" href="${esc(doiUrl(p.doi))}" target="_blank" rel="noopener">${esc(p.doi)}</a>`:""}
      <div class="pmeta">
        <span class="coll">${esc(collName(p.coll))}</span>
        <span class="pbtns">
          ${p.doi?`<button class="ibtn" data-act="copy" aria-label="Copy DOI">⧉</button>`:""}
          <button class="ibtn ${p.star?"star-on":""}" data-act="star" aria-label="${p.star?"Unstar":"Star"}">${p.star?"★":"☆"}</button>
          <button class="ibtn" data-act="edit" aria-label="Edit">✎</button>
        </span>
      </div>
    </article>`).join("");
  }

  // add / edit sheet
  const dlg=$("#dlg");
  function fillCollSelect(sel){
    $("#fColl").innerHTML=`<option value="">Unsorted</option>`+state.collections.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
    $("#fColl").value=sel||"";
  }
  function openSheet(id){
    editingId=id||null; $("#hint").textContent="";
    const p=id?state.papers.find(x=>x.id===id):null;
    $("#dlgTitle").textContent=p?"Edit paper":"Add paper";
    $("#fTitle").value=p?p.title:""; $("#fDoi").value=p?p.doi:"";
    const def=!p&&filter!=="all"&&filter!=="star"&&filter!=="none"?filter:"";
    fillCollSelect(p?p.coll:def);
    $("#delBtn").style.display=p?"":"none";
    dlg.showModal(); if(!p) $("#fTitle").focus();
  }
  function closeSheet(){dlg.close();editingId=null}
  $("#fab").addEventListener("click",()=>openSheet());
  $("#cancelBtn").addEventListener("click",closeSheet);
  dlg.addEventListener("click",e=>{if(e.target===dlg)closeSheet()});
  $("#fDoi").addEventListener("blur",()=>{$("#fDoi").value=normDoi($("#fDoi").value)});

  $("#form").addEventListener("submit",e=>{
    e.preventDefault();
    const title=$("#fTitle").value.trim().replace(/\s+/g," ");
    const doi=normDoi($("#fDoi").value);
    if(!title){$("#hint").textContent="Add a title.";$("#fTitle").focus();return}
    if(doi&&!validDoi(doi)){$("#hint").textContent="That doesn't look like a DOI. It should start with 10. followed by a slash.";$("#fDoi").focus();return}
    const dup=doi&&state.papers.find(x=>x.doi.toLowerCase()===doi.toLowerCase()&&x.id!==editingId);
    if(dup){$("#hint").textContent=`Already saved as "${dup.title}".`;return}
    const coll=$("#fColl").value;
    if(editingId){
      Object.assign(state.papers.find(x=>x.id===editingId),{title,doi,coll,updated:Date.now()});
      toast("Saved");
    }else{
      const now=Date.now();
      state.papers.push({id:uid(),title,doi,coll,star:false,added:now,updated:now});
      toast("Paper added");
    }
    persist(); render(); closeSheet();
  });
  $("#delBtn").addEventListener("click",()=>{
    const p=state.papers.find(x=>x.id===editingId); if(!p) return;
    if(!confirm(`Delete "${p.title}"?`)) return;
    state.papers=state.papers.filter(x=>x.id!==editingId); persist(); render(); closeSheet(); toast("Deleted");
  });

  // list actions
  $("#list").addEventListener("click",async e=>{
    const card=e.target.closest(".paper"); if(!card) return;
    const btn=e.target.closest("[data-act]"); if(!btn) return;
    const p=state.papers.find(x=>x.id===card.dataset.id); if(!p) return;
    const a=btn.dataset.act;
    if(a==="star"){p.star=!p.star;p.updated=Date.now();persist();render()}
    else if(a==="edit") openSheet(p.id);
    else if(a==="copy"){
      try{await navigator.clipboard.writeText(p.doi);toast("DOI copied")}
      catch(_){
        const t=document.createElement("textarea");t.value=p.doi;document.body.appendChild(t);t.select();
        try{document.execCommand("copy");toast("DOI copied")}catch(__){toast("Copy not available")}
        t.remove();
      }
    }
  });

  // filters
  $("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
  $("#sort").addEventListener("change",e=>{sortBy=e.target.value;try{localStorage.setItem("paperlib.sort",sortBy)}catch(_){}render()});
  $("#chips").addEventListener("click",e=>{
    if(e.target.closest("#chipAdd")){openColls();return}
    const b=e.target.closest("[data-f]"); if(!b) return; filter=b.dataset.f; render();
  });

  // collections sheet
  const cdlg=$("#cdlg");
  function renderColls(){
    $("#clist").innerHTML=state.collections.length?state.collections.map(c=>`<div class="crow" data-id="${c.id}">
      <label class="sr" for="cn-${c.id}">Collection name</label>
      <input id="cn-${c.id}" value="${esc(c.name)}" maxlength="60">
      <button class="ibtn" data-del aria-label="Delete collection">✕</button></div>`).join("")
      :`<p style="margin:0;color:var(--muted);font-size:.9rem">No collections yet. Try "PETase", "QM/MM methods" or "To cite".</p>`;
  }
  function openColls(){renderColls();cdlg.showModal()}
  $("#collBtn").addEventListener("click",()=>{closeMenu();openColls()});
  $("#addColl").addEventListener("click",()=>{
    const n=$("#newColl").value.trim(); if(!n) return;
    if(state.collections.some(c=>c.name.toLowerCase()===n.toLowerCase())){toast("That collection exists");return}
    state.collections.push({id:uid(),name:n}); $("#newColl").value=""; persist(); renderColls(); render();
  });
  $("#newColl").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#addColl").click()}});
  $("#clist").addEventListener("change",e=>{
    const row=e.target.closest(".crow"); if(!row) return;
    const c=state.collections.find(x=>x.id===row.dataset.id); const v=e.target.value.trim();
    if(c&&v){c.name=v;persist();render()} else if(c) e.target.value=c.name;
  });
  $("#clist").addEventListener("click",e=>{
    if(!e.target.closest("[data-del]")) return;
    const row=e.target.closest(".crow"); const c=state.collections.find(x=>x.id===row.dataset.id); if(!c) return;
    const n=state.papers.filter(p=>p.coll===c.id).length;
    if(!confirm(`Delete "${c.name}"?${n?` Its ${n} paper${n===1?"":"s"} will move to Unsorted.`:""}`)) return;
    state.papers.forEach(p=>{if(p.coll===c.id)p.coll=""});
    state.collections=state.collections.filter(x=>x.id!==c.id); persist(); renderColls(); render();
  });
  $("#cDone").addEventListener("click",()=>cdlg.close());
  cdlg.addEventListener("click",e=>{if(e.target===cdlg)cdlg.close()});

  // menu
  const menu=$("#menu");
  function closeMenu(){menu.classList.remove("open");$("#moreBtn").setAttribute("aria-expanded","false")}
  $("#moreBtn").addEventListener("click",e=>{e.stopPropagation();const o=menu.classList.toggle("open");$("#moreBtn").setAttribute("aria-expanded",o)});
  document.addEventListener("click",e=>{if(!e.target.closest("#menu"))closeMenu()});

  // export / import
  function save(filename,data){offlineSave(filename,data)}
  const stamp=()=>new Date().toISOString().slice(0,10);
  $("#exportBtn").addEventListener("click",()=>{closeMenu();save(`papers-${stamp()}.json`,JSON.stringify({version:1,exported:new Date().toISOString(),...state},null,2))});
  $("#csvBtn").addEventListener("click",()=>{
    closeMenu();
    const q=s=>`"${String(s).replace(/"/g,'""')}"`;
    const rows=[["title","doi","url","collection","starred"].join(",")]
      .concat(sorted(state.papers.filter(visible)).map(p=>[q(p.title),q(p.doi),q(p.doi?doiUrl(p.doi):""),q(collName(p.coll)),p.star?"yes":"no"].join(",")));
    save(`papers-${stamp()}.csv`,rows.join("\n"));
  });
  $("#importBtn").addEventListener("click",()=>{closeMenu();$("#importFile").click()});
  $("#importFile").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const obj=JSON.parse(await f.text());
      if(!obj||!Array.isArray(obj.papers)) throw 0;
      const collMap={};
      for(const c of (obj.collections||[])){
        if(!c||!c.name) continue;
        let ex=state.collections.find(x=>x.name.toLowerCase()===String(c.name).toLowerCase());
        if(!ex){ex={id:uid(),name:String(c.name)};state.collections.push(ex)}
        collMap[c.id]=ex.id;
      }
      const dois=new Set(state.papers.map(p=>p.doi.toLowerCase()).filter(Boolean));
      const ids=new Set(state.papers.map(p=>p.id)); let n=0;
      for(const p of obj.papers){
        if(!p||!p.title) continue;
        const doi=normDoi(p.doi||"");
        if((doi&&dois.has(doi.toLowerCase()))||ids.has(p.id)) continue;
        state.papers.push({id:p.id||uid(),title:String(p.title),doi,coll:collMap[p.coll]||"",star:!!p.star,added:p.added||Date.now(),updated:Date.now()});
        if(doi) dois.add(doi.toLowerCase()); n++;
      }
      persist(); render(); toast(`Imported ${n} paper${n===1?"":"s"}`);
    }catch(_){toast("Choose a .json backup exported from this library")}
    e.target.value="";
  });

  // boot
  try{const s=localStorage.getItem("paperlib.sort");if(s){sortBy=s;$("#sort").value=s}}catch(_){}
  const local=loadLocal(); if(local&&Array.isArray(local.papers)) state=local;
  render(); $("#sync").textContent=STORAGE_MSG();
})();
</script>
<script>window.__BACKUP={id:"paper-library",key:"paperlib.v1"};</script>
<script>
(function(){
  const C=window.__BACKUP, LK=C.id+".lastBackup", SK=C.id+".backupSnooze", WEEK=7*864e5;
  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};
  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};
  function hasData(){
    try{const v=JSON.parse(localStorage.getItem(C.key)||"null");if(!v)return false;
      if(Array.isArray(v))return v.length>0;
      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}
  }
  const bar=document.createElement("div");
  bar.className="bk hidden"; bar.setAttribute("role","status");
  bar.innerHTML='<div class="bkt"><b></b><span>A copy goes to your Downloads folder.</span></div><button class="bkno" type="button">Later</button><button class="bkgo" type="button">Back up now</button>';
  const wrap=document.querySelector(".wrap"), head=wrap&&wrap.querySelector(":scope > header");
  if(head) head.insertAdjacentElement("afterend",bar); else if(wrap) wrap.prepend(bar);
  function check(){
    const now=Date.now(), last=get(LK), data=hasData();
    // never backed up: start the 7-day clock from when data first appears
    if(!last&&data&&!get(C.id+".firstData")) set(C.id+".firstData",now);
    const ref=last||get(C.id+".firstData")||now;
    const due=data&&now-ref>WEEK&&now>get(SK);
    bar.classList.toggle("hidden",!due);
    if(due){
      const days=last?Math.floor((now-last)/864e5):0;
      bar.querySelector("b").textContent=last?`Last backup ${days} days ago`:"Not backed up yet";
    }
  }
  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};
  bar.querySelector(".bkgo").addEventListener("click",()=>{const b=document.getElementById("exportBtn");if(b)b.click()});
  bar.querySelector(".bkno").addEventListener("click",()=>{set(SK,Date.now()+864e5);check()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
  window.addEventListener("storage",check);
  setInterval(check,36e5);
  // first check after the app has loaded its data; recheck when data changes
  setTimeout(check,300);
  let t=null; document.addEventListener("click",()=>{clearTimeout(t);t=setTimeout(check,600)},true);
})();
</script>
