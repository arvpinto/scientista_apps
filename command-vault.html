<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<title>Commands</title>
<style>
:root{
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  --bg:#14161B;--surface:#1C1F26;--raised:#242832;--ink:#E7E9EE;--muted:#8B919E;--faint:#2C303A;
  --accent:#9DB2FF;--danger:#F28B82;--gold:#E6C170;--green:#7DCB9C;--violet:#C3A6F0;--pink:#EE93AF;--teal:#8CC3CC;
  --font:"Manrope",system-ui,Roboto,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}
h1 .n{font-weight:400;color:var(--muted);font-size:1rem;margin-left:6px}
.hbtns{display:flex;gap:4px;position:relative}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);display:grid;place-items:center;font-size:1.1rem}
.ibtn:active{background:var(--surface)}
.menu{position:absolute;right:0;top:48px;background:var(--raised);border-radius:12px;padding:6px;min-width:200px;display:none;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}
.menu button:active{background:var(--faint)}
.search{width:100%;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;min-height:48px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 14px;min-height:38px;color:var(--muted);background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .c{opacity:.7}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;color:var(--muted);font-size:.85rem;gap:8px}
.bar select{background:transparent;border:0;color:var(--muted);padding:6px 0;min-height:40px;max-width:60%}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:14px;padding:14px 10px 8px 16px}
.card h3{font-size:1rem;font-weight:500;margin:0;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:.82rem;color:var(--muted)}
.pill{flex:0 0 auto;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,transparent)}
.note{font-size:.88rem;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;justify-content:flex-end;margin-top:2px;flex-wrap:wrap}
.acts .ibtn{min-width:40px;min-height:40px;font-size:.95rem}
.acts .txt{font-size:.85rem;padding:0 10px;color:var(--accent)}
.star-on{color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--accent);color:#14161B;font-size:1.8rem;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:4}
dialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet h4{margin:6px 0 -4px;font-size:.8rem;font-weight:500;color:var(--accent)}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.sheet input,.sheet select,.sheet textarea{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%;min-width:0}
.sheet textarea{min-height:90px;resize:vertical}
.mono{font-family:var(--mono)!important;font-size:.88rem!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:1rem!important}
.check input{min-height:auto!important;width:20px!important;height:20px;accent-color:var(--accent)}
.hint{font-size:.8rem;color:var(--danger);min-height:1em;margin:0}
.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.btn{border-radius:12px;padding:12px 16px;min-height:48px}
.btn.primary{background:var(--accent);color:#14161B;font-weight:700}
.btn.ghost{color:var(--muted)}
.btn.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}
.toast.show{opacity:1}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}
.cmd{font-family:var(--mono);font-size:.84rem;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);line-height:1.5}
.cmd .v{color:var(--gold)}
.preview{font-family:var(--mono);font-size:.84rem;background:var(--surface);border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.starter{margin-top:14px}
/* ---- Theme: dark with pink-to-blue accents ---- */
:root{
  --bg:#000000;--surface:#131316;--raised:#1D1D22;--ink:#F2F2F4;--muted:#9D9DA5;--faint:#28282E;
  --accent:#EBA8E4;--accent2:#A7CBF4;
  --grad:linear-gradient(90deg,#F0A8DC 0%,#C9B6EF 50%,#A6CCF5 100%);
  --danger:#EF5A50;--star:#EBA8E4;--pinbg:#2A2413;
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{background-color:#000;background-image:linear-gradient(172deg,#5A4360 0%,#352C3F 90px,#15121A 210px,#000 320px);background-repeat:no-repeat;background-size:100% 340px}
h1{font-weight:500;font-size:1.85rem;letter-spacing:0}
h1 .n{font-size:1rem}
.search{background:#0E0E11;border:1.5px solid #2E2E35;border-radius:999px}
.search:focus{border-color:#9C8BC0;outline:none}
.chip{background:#000;border:1.5px solid #3B3B43;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#17161C;font-weight:500}
.chip.add{color:var(--accent)}
.tab[aria-selected="true"]::after{background:var(--grad)}
.btn.primary,.add{background:var(--grad)!important;color:#17161C!important}
.fab{background:#17171C;border:1px solid #3A3A42;color:#D9B9EE;box-shadow:0 8px 22px rgba(0,0,0,.7)}
.star-on{color:var(--star)!important}
.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}
.menu{background:var(--raised);border:1px solid #2E2E35}
dialog{background:var(--raised)}
.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:#0F0F12}
.toast{background:#26262C;color:var(--ink)}
.doi{color:var(--accent2)}
.sync{color:#6F6F77}
.seg button[aria-pressed="true"]{background:var(--grad);color:#17161C}
.topbar{background:linear-gradient(172deg,#5A4360 0%,#2A2432 100%)}
.toolbar{background:#000}
.bk.hidden{display:none!important}
.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,#2A2413);border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}
.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}
.bk .bkt b{display:block;font-weight:500}
.bk .bkt span{color:var(--muted);font-size:.8rem}
.bk .bkgo{background:var(--grad);color:#17161C;border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}
.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Commands<span class="n" id="total"></span></h1>
    <div class="hbtns">
      <button class="ibtn" id="moreBtn" aria-label="More options" aria-expanded="false">⋮</button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="starterBtn">Add starter commands</button>
        <button role="menuitem" id="mdBtn">Export as Markdown</button>
        <button role="menuitem" id="exportBtn">Export backup</button>
        <button role="menuitem" id="importBtn">Import backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>
  <label class="sr" for="search">Search commands</label>
  <input class="search" id="search" type="search" placeholder="Search title, command or notes">
  <div class="chips" id="chips"></div>
  <div class="bar">
    <span id="count"></span>
    <label><span class="sr">Sort</span><select id="sort">
      <option value="used">Most used</option><option value="recent">Recently added</option><option value="az">A to Z</option>
    </select></label>
  </div>
  <main class="list" id="list"></main>
  <p class="sync" id="sync"></p>
</div>
<button class="fab" id="fab" aria-label="Add command">+</button>
<datalist id="dlTool"></datalist>

<dialog id="dlg">
  <form class="sheet" id="form" autocomplete="off" novalidate>
    <h2 id="dTitle">New command</h2>
    <label>What it does<input id="fTitle" maxlength="120" placeholder="Center protein and remove PBC"></label>
    <label>Command<textarea id="fCmd" class="mono" spellcheck="false" autocapitalize="off" placeholder="gmx trjconv -s {tpr} -f {xtc} -o {out}.xtc -pbc mol -center"></textarea></label>
    <p style="margin:-6px 0 0;font-size:.8rem;color:var(--muted)">Wrap parts that change in braces, like {jobid}. You'll fill them in before copying.</p>
    <label>Tool<input id="fTool" list="dlTool" maxlength="30" placeholder="GROMACS"></label>
    <label>Notes<textarea id="fNotes" maxlength="1500" placeholder="Choose group 1 (Protein) to center, 0 (System) for output"></textarea></label>
    <label class="check"><input type="checkbox" id="fStar"> Favourite</label>
    <p class="hint" id="hint"></p>
    <div class="sbar">
      <button type="button" class="btn danger" id="delBtn">Delete</button>
      <span style="display:flex;gap:6px;margin-left:auto">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<dialog id="fill">
  <form class="sheet" id="fillForm" autocomplete="off">
    <h2 id="fillTitle">Fill in</h2>
    <div id="fillFields" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="preview" id="fillPreview"></div>
    <div class="sbar"><span></span>
      <span style="display:flex;gap:6px">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Copy</button>
      </span>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const stamp=()=>new Date().toISOString().slice(0,10);
let _tt=null;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove("show"),2400)}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg||"Copied")}
  catch(_){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");toast(msg||"Copied")}catch(__){toast("Copy not available")}a.remove()}
}
function storageWorks(){try{const k="__probe"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(_){return false}}
function saveFile(filename,data){
  try{
    const ext=(filename.split(".").pop()||"").toLowerCase();
    const type={json:"application/json",csv:"text/csv",md:"text/markdown",py:"text/x-python",sh:"text/x-shellscript",png:"image/png"}[ext]||"text/plain";
    const blob=data instanceof Blob?data:new Blob([data],{type:type+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;a.style.display="none";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast("Saved to Downloads");if(/\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();
  }catch(_){toast("Couldn't save the file")}
}
function setupMenu(){
  const menu=$("#menu"),btn=$("#moreBtn");
  const close=()=>{menu.classList.remove("open");btn.setAttribute("aria-expanded","false")};
  btn.addEventListener("click",e=>{e.stopPropagation();btn.setAttribute("aria-expanded",menu.classList.toggle("open"))});
  document.addEventListener("click",e=>{if(!e.target.closest("#menu"))close()});
  menu.addEventListener("click",close);
  document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
  document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
}
// Store: kept in this browser's local storage only.
function makeStore(lsKey,docName,listKeys,onChange){
  const S={data:null};
  try{const r=localStorage.getItem(lsKey);S.data=r?JSON.parse(r):null}catch(_){}
  if(!S.data||typeof S.data!=="object") S.data={};
  listKeys.forEach(k=>{if(!Array.isArray(S.data[k]))S.data[k]=[]});
  S.saveLocal=()=>{try{localStorage.setItem(lsKey,JSON.stringify(S.data))}catch(_){toast("Couldn't save. Storage is full or blocked; export a backup.")}};
  S.persist=()=>S.saveLocal();
  S.connect=()=>{
    $("#sync").textContent=storageWorks()?"Saved on this phone. Export a backup now and then.":"Storage is blocked here, so changes will be lost when you close this page.";
  };
  return S;
}

(function(){
  const PALETTE=["--accent","--green","--gold","--violet","--pink","--teal"];
  const STARTERS=[
    ["My jobs in the queue","squeue -u $USER","Slurm",""],
    ["Submit a job script","sbatch {script}.sh","Slurm",""],
    ["Cancel a job","scancel {jobid}","Slurm",""],
    ["Accounting for a finished job","sacct -j {jobid} --format=JobID,JobName,State,Elapsed,NNodes,MaxRSS","Slurm",""],
    ["Continue MD from checkpoint","gmx mdrun -deffnm {name} -cpi {name}.cpt","GROMACS","Add -append (default in recent versions) to keep writing to the same files."],
    ["Center protein and remove PBC","gmx trjconv -s {tpr} -f {xtc} -o {out}.xtc -pbc mol -center","GROMACS","Pick the group to center, then the output group."],
    ["Extract energy terms","gmx energy -f {edr} -o {out}.xvg","GROMACS","Type the terms interactively, end with 0."],
    ["Backbone RMSD in ns","gmx rms -s {tpr} -f {xtc} -o rmsd.xvg -tu ns","GROMACS",""],
    ["Follow a log file","tail -f {file}","Bash",""],
    ["Folder sizes, largest last","du -sh * | sort -h","Bash",""],
    ["Pull results from the cluster","rsync -avzP {user}@{host}:{remote_path} {local_path}","Bash","Add --exclude='*.trr' to skip big files."]
  ];
  let filter="all",query="",sortBy="used",editing=null,filling=null;
  const store=makeStore("cmdvault.v1","commands",["cmds"],render);
  const D=()=>store.data;

  const vars=c=>[...new Set((c.match(/\{([A-Za-z_][\w-]{0,30})\}/g)||[]).map(v=>v.slice(1,-1)))];
  const tools=()=>[...new Set(D().cmds.map(c=>c.tool).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const toolColor=t=>`var(${PALETTE[Math.abs([...t].reduce((h,ch)=>h*31+ch.charCodeAt(0)|0,7))%PALETTE.length]})`;
  const hl=c=>esc(c).replace(/\{([A-Za-z_][\w-]{0,30})\}/g,'<span class="v">{$1}</span>');

  function render(){
    const T=tools();
    if(filter!=="all"&&filter!=="star"&&!T.includes(filter)) filter="all";
    $("#dlTool").innerHTML=["GROMACS","AMBER","Slurm","Bash","VMD","Python","CP2K","Gaussian","PLUMED","Git"].concat(T).filter((v,i,a)=>a.indexOf(v)===i).map(t=>`<option>${esc(t)}</option>`).join("");
    const C=D().cmds;
    $("#total").textContent=C.length||"";
    $("#chips").innerHTML=[`<button class="chip" data-f="all" aria-pressed="${filter==="all"}">All<span class="c">${C.length}</span></button>`,
      `<button class="chip" data-f="star" aria-pressed="${filter==="star"}">★ Favourites<span class="c">${C.filter(c=>c.star).length}</span></button>`]
      .concat(T.map(t=>`<button class="chip" data-f="${esc(t)}" aria-pressed="${filter===t}" style="--cc:${toolColor(t)}"><span class="dot"></span>${esc(t)}<span class="c">${C.filter(c=>c.tool===t).length}</span></button>`)).join("");
    let list=C.filter(c=>(filter==="all"||(filter==="star"?c.star:c.tool===filter))&&(!query||[c.title,c.cmd,c.notes,c.tool].join(" ").toLowerCase().includes(query)));
    if(sortBy==="used") list.sort((a,b)=>((b.star?1:0)-(a.star?1:0))||((b.uses||0)-(a.uses||0))||((b.usedAt||0)-(a.usedAt||0)));
    else if(sortBy==="recent") list.sort((a,b)=>b.added-a.added);
    else list.sort((a,b)=>a.title.localeCompare(b.title));
    $("#count").textContent=`${list.length} command${list.length===1?"":"s"}`;
    $("#list").innerHTML=list.length?list.map(c=>`<article class="card" data-id="${c.id}">
      <div class="top"><h3>${esc(c.title)}</h3>${c.tool?`<span class="pill" style="--cc:${toolColor(c.tool)}">${esc(c.tool)}</span>`:""}</div>
      <div class="cmd">${hl(c.cmd)}</div>
      ${c.notes?`<div class="note">${esc(c.notes)}</div>`:""}
      <div class="acts">
        <button class="ibtn ${c.star?"star-on":""}" data-act="star" aria-label="${c.star?"Remove favourite":"Favourite"}">${c.star?"★":"☆"}</button>
        <button class="ibtn" data-act="edit" aria-label="Edit">✎</button>
        <button class="ibtn txt" data-act="copy">${vars(c.cmd).length?"Fill and copy":"Copy"}</button>
      </div></article>`).join("")
      :`<div class="empty">${C.length?"No commands match.":`Tap + to save your first command.<div class="starter"><button class="btn primary" id="starterEmpty">Add starter commands</button></div>`}</div>`;
  }

  function addStarters(){
    const have=new Set(D().cmds.map(c=>c.cmd)); let n=0; const now=Date.now();
    STARTERS.forEach(([title,cmd,tool,notes],i)=>{if(!have.has(cmd)){D().cmds.push({id:uid(),title,cmd,tool,notes,star:false,uses:0,added:now-i,updated:now});n++}});
    store.persist(); render(); toast(n?`Added ${n} commands`:"Starters already added");
  }
  $("#starterBtn").addEventListener("click",addStarters);
  $("#list").addEventListener("click",e=>{
    if(e.target.closest("#starterEmpty")){addStarters();return}
    const b=e.target.closest("[data-act]"); if(!b) return;
    const c=D().cmds.find(x=>x.id===b.closest(".card").dataset.id); if(!c) return;
    const a=b.dataset.act;
    if(a==="star"){c.star=!c.star;c.updated=Date.now();store.persist();render()}
    else if(a==="edit") openEdit(c.id);
    else if(a==="copy"){
      const vs=vars(c.cmd);
      if(!vs.length){copyText(c.cmd,"Copied");bump(c);return}
      openFill(c,vs);
    }
  });
  function bump(c){c.uses=(c.uses||0)+1;c.usedAt=Date.now();c.updated=Date.now();store.persist();render()}

  // fill-in sheet
  const fill=$("#fill");
  function openFill(c,vs){
    filling=c; c.last=c.last||{};
    $("#fillTitle").textContent=c.title;
    $("#fillFields").innerHTML=vs.map(v=>`<label>${esc(v)}<input data-v="${esc(v)}" class="mono" autocapitalize="off" spellcheck="false" value="${esc(c.last[v]||"")}"></label>`).join("");
    updPreview(); fill.showModal();
    const first=$("#fillFields input"); if(first) first.focus();
  }
  function filled(){
    let out=filling.cmd;
    document.querySelectorAll("#fillFields input").forEach(i=>{const v=i.dataset.v;out=out.split("{"+v+"}").join(i.value||"{"+v+"}")});
    return out;
  }
  function updPreview(){$("#fillPreview").innerHTML=hl(filled())}
  $("#fillFields").addEventListener("input",updPreview);
  $("#fillForm").addEventListener("submit",e=>{
    e.preventDefault();
    document.querySelectorAll("#fillFields input").forEach(i=>{if(i.value)filling.last[i.dataset.v]=i.value});
    copyText(filled(),"Copied"); bump(filling); fill.close();
  });

  // edit sheet
  const dlg=$("#dlg");
  function openEdit(id){
    editing=id||null; $("#hint").textContent="";
    const c=id?D().cmds.find(x=>x.id===id):null;
    $("#dTitle").textContent=c?"Edit command":"New command";
    $("#fTitle").value=c?.title||""; $("#fCmd").value=c?.cmd||"";
    $("#fTool").value=c?.tool||(filter!=="all"&&filter!=="star"?filter:""); $("#fNotes").value=c?.notes||""; $("#fStar").checked=!!c?.star;
    $("#delBtn").style.display=c?"":"none"; dlg.showModal(); if(!c) $("#fTitle").focus();
  }
  $("#fab").addEventListener("click",()=>openEdit());
  $("#form").addEventListener("submit",e=>{
    e.preventDefault();
    const title=$("#fTitle").value.trim(), cmd=$("#fCmd").value.replace(/\s+$/,"");
    if(!title){$("#hint").textContent="Describe what the command does.";return}
    if(!cmd.trim()){$("#hint").textContent="Paste or type the command.";return}
    const now=Date.now(), data={title,cmd,tool:$("#fTool").value.trim(),notes:$("#fNotes").value.trim(),star:$("#fStar").checked,updated:now};
    const c=editing?D().cmds.find(x=>x.id===editing):null;
    if(c) Object.assign(c,data); else D().cmds.push({id:uid(),uses:0,added:now,...data});
    store.persist(); render(); dlg.close(); toast(c?"Saved":"Command added");
  });
  $("#delBtn").addEventListener("click",()=>{
    const c=D().cmds.find(x=>x.id===editing); if(!c||!confirm(`Delete "${c.title}"?`)) return;
    D().cmds=D().cmds.filter(x=>x.id!==editing); store.persist(); render(); dlg.close(); toast("Deleted");
  });

  $("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
  $("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;render()});
  $("#sort").addEventListener("change",e=>{sortBy=e.target.value;try{localStorage.setItem("cmdvault.sort",sortBy)}catch(_){}render()});

  $("#mdBtn").addEventListener("click",()=>{
    const by={}; D().cmds.forEach(c=>(by[c.tool||"Other"]=by[c.tool||"Other"]||[]).push(c));
    const md=["# Command vault",""].concat(Object.keys(by).sort().flatMap(t=>["## "+t,""].concat(by[t].sort((a,b)=>a.title.localeCompare(b.title)).flatMap(c=>["### "+c.title,"","```bash",c.cmd,"```"].concat(c.notes?["",c.notes]:[]).concat([""]))))).join("\n");
    saveFile(`commands-${stamp()}.md`,md);
  });
  $("#exportBtn").addEventListener("click",()=>saveFile(`commands-${stamp()}.json`,JSON.stringify({version:1,exported:new Date().toISOString(),cmds:D().cmds},null,2)));
  $("#importBtn").addEventListener("click",()=>$("#importFile").click());
  $("#importFile").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{const o=JSON.parse(await f.text()); if(!Array.isArray(o.cmds)) throw 0;
      const ids=new Set(D().cmds.map(c=>c.id)),cs=new Set(D().cmds.map(c=>c.cmd)); let n=0;
      for(const c of o.cmds) if(c&&c.title&&c.cmd&&!ids.has(c.id)&&!cs.has(c.cmd)){D().cmds.push({...c,id:c.id||uid(),updated:Date.now()});n++}
      store.persist(); render(); toast(`Imported ${n} command${n===1?"":"s"}`);
    }catch(_){toast("Choose a .json backup exported from this vault")}
    e.target.value="";
  });

  setupMenu();
  try{const s=localStorage.getItem("cmdvault.sort");if(s){sortBy=s;$("#sort").value=s}}catch(_){}
  render(); store.connect();
})();
</script>
<script>window.__BACKUP={id:"command-vault",key:"cmdvault.v1"};</script>
<script>
(function(){
  const C=window.__BACKUP, LK=C.id+".lastBackup", SK=C.id+".backupSnooze", WEEK=7*864e5;
  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};
  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};
  function hasData(){
    try{const v=JSON.parse(localStorage.getItem(C.key)||"null");if(!v)return false;
      if(Array.isArray(v))return v.length>0;
      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}
  }
  const bar=document.createElement("div");
  bar.className="bk hidden"; bar.setAttribute("role","status");
  bar.innerHTML='<div class="bkt"><b></b><span>A copy goes to your Downloads folder.</span></div><button class="bkno" type="button">Later</button><button class="bkgo" type="button">Back up now</button>';
  const wrap=document.querySelector(".wrap"), head=wrap&&wrap.querySelector(":scope > header");
  if(head) head.insertAdjacentElement("afterend",bar); else if(wrap) wrap.prepend(bar);
  function check(){
    const now=Date.now(), last=get(LK), data=hasData();
    // never backed up: start the 7-day clock from when data first appears
    if(!last&&data&&!get(C.id+".firstData")) set(C.id+".firstData",now);
    const ref=last||get(C.id+".firstData")||now;
    const due=data&&now-ref>WEEK&&now>get(SK);
    bar.classList.toggle("hidden",!due);
    if(due){
      const days=last?Math.floor((now-last)/864e5):0;
      bar.querySelector("b").textContent=last?`Last backup ${days} days ago`:"Not backed up yet";
    }
  }
  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};
  bar.querySelector(".bkgo").addEventListener("click",()=>{const b=document.getElementById("exportBtn");if(b)b.click()});
  bar.querySelector(".bkno").addEventListener("click",()=>{set(SK,Date.now()+864e5);check()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
  window.addEventListener("storage",check);
  setInterval(check,36e5);
  // first check after the app has loaded its data; recheck when data changes
  setTimeout(check,300);
  let t=null; document.addEventListener("click",()=>{clearTimeout(t);t=setTimeout(check,600)},true);
})();
</script>
