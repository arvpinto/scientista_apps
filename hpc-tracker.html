<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<title>HPC jobs</title>
<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#14161B; --surface:#1C1F26; --raised:#242832; --ink:#E7E9EE; --muted:#8B919E; --faint:#2C303A;
  --accent:#9DB2FF; --danger:#F28B82;
  --s-queued:#E6C170; --s-running:#7DCB9C; --s-done:#8FB0FF; --s-failed:#F28B82; --s-cancelled:#8B919E; --s-analysed:#C3A6F0;
  --font:"Manrope",system-ui,Roboto,"Segoe UI",sans-serif;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}

header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}
.hbtns{display:flex;gap:4px;position:relative}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);display:grid;place-items:center;font-size:1.1rem}
.ibtn:active{background:var(--surface)}
.menu{position:absolute;right:0;top:48px;background:var(--raised);border-radius:12px;padding:6px;min-width:190px;display:none;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}
.menu button:active{background:var(--faint)}

.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--faint);margin-bottom:14px}
.tab{padding:12px 4px;color:var(--muted);font-weight:500;position:relative;min-height:48px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sum{background:var(--surface);border-radius:12px;padding:10px 8px;text-align:center}
.sum b{display:block;font-size:1.3rem;font-weight:700}
.sum span{font-size:.75rem;color:var(--muted)}

.search{width:100%;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;min-height:48px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 14px;min-height:38px;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip .c{opacity:.7;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;color:var(--muted);font-size:.85rem;gap:8px}
.bar select{background:transparent;border:0;color:var(--muted);padding:6px 0;min-height:40px;max-width:55%}

.list{display:flex;flex-direction:column;gap:8px}
.job,.alloc{background:var(--surface);border-radius:14px;padding:14px 10px 8px 16px}
.job.attn{box-shadow:inset 3px 0 0 var(--s-queued)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job h3,.alloc h3{font-size:1rem;font-weight:500;margin:0;overflow-wrap:anywhere}
.pill{flex:0 0 auto;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--sc);background:color-mix(in srgb,var(--sc) 16%,transparent);min-height:28px}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:.82rem;color:var(--muted)}
.jid{font-variant-numeric:tabular-nums}
.prog{margin-top:10px}
.track{height:6px;background:var(--faint);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--sc,var(--accent));border-radius:3px}
.plab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:4px;gap:8px}
.note{font-size:.85rem;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.warn{color:var(--s-queued)}
.acts{display:flex;justify-content:flex-end;margin-top:2px;flex-wrap:wrap}
.acts .ibtn{min-width:40px;min-height:40px;font-size:.95rem}
.acts .txt{font-size:.85rem;padding:0 10px;color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:48px 16px}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--accent);color:#14161B;font-size:1.8rem;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:4}

dialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet h4{margin:6px 0 -4px;font-size:.8rem;font-weight:500;color:var(--accent)}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.sheet input,.sheet select,.sheet textarea{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%;min-width:0}
.sheet textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:.8rem;color:var(--danger);min-height:1em;margin:0}
.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.btn{border-radius:12px;padding:12px 16px;min-height:48px}
.btn.primary{background:var(--accent);color:#14161B;font-weight:700}
.btn.ghost{color:var(--muted)}
.btn.danger{color:var(--danger)}
.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.statuses button{padding:12px 6px;border-radius:12px;background:var(--surface);color:var(--sc);font-weight:500}
.statuses button[aria-pressed="true"]{background:color-mix(in srgb,var(--sc) 22%,var(--surface));outline:1px solid var(--sc)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}
.toast.show{opacity:1}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}
/* ---- Theme: dark with pink-to-blue accents ---- */
:root{
  --bg:#000000;--surface:#131316;--raised:#1D1D22;--ink:#F2F2F4;--muted:#9D9DA5;--faint:#28282E;
  --accent:#EBA8E4;--accent2:#A7CBF4;
  --grad:linear-gradient(90deg,#F0A8DC 0%,#C9B6EF 50%,#A6CCF5 100%);
  --danger:#EF5A50;--star:#EBA8E4;--pinbg:#2A2413;
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{background-color:#000;background-image:linear-gradient(172deg,#5A4360 0%,#352C3F 90px,#15121A 210px,#000 320px);background-repeat:no-repeat;background-size:100% 340px}
h1{font-weight:500;font-size:1.85rem;letter-spacing:0}
h1 .n{font-size:1rem}
.search{background:#0E0E11;border:1.5px solid #2E2E35;border-radius:999px}
.search:focus{border-color:#9C8BC0;outline:none}
.chip{background:#000;border:1.5px solid #3B3B43;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#17161C;font-weight:500}
.chip.add{color:var(--accent)}
.tab[aria-selected="true"]::after{background:var(--grad)}
.btn.primary,.add{background:var(--grad)!important;color:#17161C!important}
.fab{background:#17171C;border:1px solid #3A3A42;color:#D9B9EE;box-shadow:0 8px 22px rgba(0,0,0,.7)}
.star-on{color:var(--star)!important}
.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}
.menu{background:var(--raised);border:1px solid #2E2E35}
dialog{background:var(--raised)}
.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:#0F0F12}
.toast{background:#26262C;color:var(--ink)}
.doi{color:var(--accent2)}
.sync{color:#6F6F77}
.seg button[aria-pressed="true"]{background:var(--grad);color:#17161C}
.topbar{background:linear-gradient(172deg,#5A4360 0%,#2A2432 100%)}
.toolbar{background:#000}
.bk.hidden{display:none!important}
.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,#2A2413);border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}
.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}
.bk .bkt b{display:block;font-weight:500}
.bk .bkt span{color:var(--muted);font-size:.8rem}
.bk .bkgo{background:var(--grad);color:#17161C;border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}
.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HPC</h1>
    <div class="hbtns">
      <button class="ibtn" id="moreBtn" aria-label="More options" aria-expanded="false">⋮</button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="clearBtn">Remove analysed jobs</button>
        <button role="menuitem" id="csvBtn">Export jobs as CSV</button>
        <button role="menuitem" id="exportBtn">Export backup</button>
        <button role="menuitem" id="importBtn">Import backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="jobs" aria-selected="true">Calculations</button>
    <button class="tab" role="tab" data-view="allocs" aria-selected="false">Allocations</button>
  </nav>

  <section id="jobsView">
    <div class="summary" id="summary"></div>
    <label class="sr" for="search">Search calculations</label>
    <input class="search" id="search" type="search" placeholder="Search name, job ID, system, path">
    <div class="chips" id="chips"></div>
    <div class="bar">
      <span id="count"></span>
      <label><span class="sr">Project</span><select id="projFilter"></select></label>
    </div>
    <main class="list" id="jobs"></main>
  </section>

  <section id="allocsView" class="hidden">
    <main class="list" id="allocs"></main>
  </section>

  <p class="sync" id="sync"></p>
</div>

<button class="fab" id="fab" aria-label="Add">+</button>

<datalist id="dlProj"></datalist>
<datalist id="dlCluster"></datalist>
<datalist id="dlSoft"><option>GROMACS</option><option>AMBER</option><option>CP2K</option><option>Gaussian</option><option>ORCA</option><option>PLUMED</option><option>Rosetta</option><option>AlphaFold</option></datalist>
<datalist id="dlType"><option>Classical MD</option><option>QM/MM MD</option><option>QM/MM optimisation</option><option>DFT</option><option>Metadynamics</option><option>Umbrella sampling</option><option>Free energy</option><option>Equilibration</option><option>Minimisation</option><option>Structure prediction</option></datalist>

<dialog id="jdlg">
  <form class="sheet" id="jform" autocomplete="off" novalidate>
    <h2 id="jTitle">New calculation</h2>
    <label>Name<input id="jName" maxlength="120" placeholder="PETase WT on PET NP, replica 1"></label>
    <div class="statuses" id="jStatus"></div>
    <div class="row">
      <label>Project<input id="jProj" list="dlProj" maxlength="60"></label>
      <label>Cluster<input id="jCluster" list="dlCluster" maxlength="60"></label>
    </div>
    <div class="row">
      <label>Software<input id="jSoft" list="dlSoft" maxlength="40"></label>
      <label>Type<input id="jType" list="dlType" maxlength="40"></label>
    </div>
    <div class="row">
      <label>Job ID<input id="jId" maxlength="40" inputmode="numeric"></label>
      <label>Segment<input id="jSeg" type="number" min="1" step="1" inputmode="numeric"></label>
    </div>
    <h4>Resources and time</h4>
    <div class="row3">
      <label>Nodes<input id="jNodes" type="number" min="0" step="1" inputmode="numeric"></label>
      <label>Cores<input id="jCores" type="number" min="0" step="1" inputmode="numeric"></label>
      <label>GPUs<input id="jGpus" type="number" min="0" step="1" inputmode="numeric"></label>
    </div>
    <div class="row">
      <label>Started<input id="jStart" type="datetime-local"></label>
      <label>Walltime (h)<input id="jWall" type="number" min="0" step="0.5" inputmode="decimal"></label>
    </div>
    <h4>Progress (optional)</h4>
    <div class="row3">
      <label>Done<input id="jDone" type="number" min="0" step="any" inputmode="decimal"></label>
      <label>Target<input id="jTarget" type="number" min="0" step="any" inputmode="decimal"></label>
      <label>Unit<input id="jUnit" maxlength="12" placeholder="ns"></label>
    </div>
    <label>Rate per day (e.g. ns/day)<input id="jRate" type="number" min="0" step="any" inputmode="decimal"></label>
    <label>Path on cluster<input id="jPath" maxlength="300" autocapitalize="off" spellcheck="false" placeholder="/projects/.../run01"></label>
    <label>Notes<textarea id="jNotes" maxlength="2000"></textarea></label>
    <p class="hint" id="jHint"></p>
    <div class="sbar">
      <button type="button" class="btn danger" id="jDel">Delete</button>
      <span style="display:flex;gap:6px;margin-left:auto">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<dialog id="adlg">
  <form class="sheet" id="aform" autocomplete="off" novalidate>
    <h2 id="aTitle">New allocation</h2>
    <label>Name<input id="aName" maxlength="80" placeholder="FCT CPCA A2, PETase screening"></label>
    <div class="row">
      <label>Cluster<input id="aCluster" list="dlCluster" maxlength="60"></label>
      <label>Unit<select id="aUnit"><option>CPU-h</option><option>GPU-h</option><option>node-h</option></select></label>
    </div>
    <div class="row">
      <label>Awarded<input id="aTotal" type="number" min="0" step="any" inputmode="decimal"></label>
      <label>Used so far<input id="aUsed" type="number" min="0" step="any" inputmode="decimal"></label>
    </div>
    <div class="row">
      <label>Start<input id="aStart" type="date"></label>
      <label>End<input id="aEnd" type="date"></label>
    </div>
    <label>Notes<textarea id="aNotes" maxlength="1000"></textarea></label>
    <p class="hint" id="aHint"></p>
    <div class="sbar">
      <button type="button" class="btn danger" id="aDel">Delete</button>
      <span style="display:flex;gap:6px;margin-left:auto">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<dialog id="udlg">
  <form class="sheet" id="uform">
    <h2 id="uTitle">Update usage</h2>
    <label id="uLabel">Used so far<input id="uVal" type="number" min="0" step="any" inputmode="decimal"></label>
    <div class="sbar"><span></span>
      <span style="display:flex;gap:6px">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  function offlineSave(filename,data){
    try{
      const ext=(filename.split(".").pop()||"").toLowerCase();
      const type={json:"application/json",csv:"text/csv",md:"text/markdown",png:"image/png"}[ext]||"text/plain";
      const blob=data instanceof Blob?data:new Blob([data],{type:type+";charset=utf-8"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download=filename;a.style.display="none";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      toast("Saved to Downloads");if(/\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();
    }catch(_){toast("Couldn't save the file")}
  }
  function storageWorks(){try{const k="__probe"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(_){return false}}
  const STORAGE_MSG=()=>storageWorks()?"Saved on this phone. Export a backup now and then.":"Storage is blocked here, so changes will be lost when you close this page.";
  const STATUS=[
    {id:"queued",name:"Queued"},{id:"running",name:"Running"},{id:"done",name:"Completed"},
    {id:"failed",name:"Failed"},{id:"cancelled",name:"Cancelled"},{id:"analysed",name:"Analysed"}
  ];
  const LS_KEY="hpctracker.v1";
  let state={jobs:[],allocs:[]};
  let view="jobs", sFilter="active", pFilter="", query="", editingJob=null, editingAlloc=null, updating=null, jStatus="queued";

  const $=s=>document.querySelector(s);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
  const sc=s=>`var(--s-${s})`;
  const fmtN=n=>n==null?"":(Math.abs(n)>=1e4?Math.round(n).toLocaleString("en-GB"):(+n.toFixed(2)).toLocaleString("en-GB"));
  function fmtDur(ms){
    const neg=ms<0; ms=Math.abs(ms);
    const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), m=Math.floor(ms%36e5/6e4);
    const s=d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`;
    return neg?"-"+s:s;
  }
  function fmtDate(t){const d=new Date(t);return d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
  function toLocalInput(t){if(!t)return"";const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}

  let tt=null;
  function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2400)}

  // storage
  function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
  function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){toast("Couldn\'t save. Storage is full or blocked; export a backup.")}}
  function persist(){saveLocal()}

  // derived job info
  function jobInfo(j,now){
    const info={};
    if(j.status==="running"&&j.start){
      info.elapsed=now-j.start;
      if(j.wall){info.ends=j.start+j.wall*36e5;info.left=info.ends-now;info.overdue=info.left<0}
    }
    if(j.target){
      let done=j.done||0;
      // live estimate while running, from rate and time since last update
      if(j.status==="running"&&j.rate&&j.doneAt) done=Math.min(j.target,done+j.rate*(now-j.doneAt)/864e5);
      info.done=done; info.pct=Math.max(0,Math.min(100,done/j.target*100));
      if(j.rate&&done<j.target&&(j.status==="running"||j.status==="queued")) info.eta=(j.target-done)/j.rate*864e5;
      info.est=j.status==="running"&&j.rate&&j.doneAt;
    }
    if(j.start&&(j.cores||j.gpus)){
      const hrs=(j.status==="running"?(now-j.start):(j.end?j.end-j.start:0))/36e5;
      if(hrs>0){info.coreh=(j.cores||0)*hrs;info.gpuh=(j.gpus||0)*hrs}
    }
    return info;
  }
  const attention=(j,i)=>i.overdue||j.status==="failed";

  // render jobs
  function refreshDatalists(){
    const uniq=a=>[...new Set(a.filter(Boolean))].sort();
    const projs=uniq(state.jobs.map(j=>j.proj));
    $("#dlProj").innerHTML=projs.map(p=>`<option>${esc(p)}</option>`).join("");
    $("#dlCluster").innerHTML=uniq(state.jobs.map(j=>j.cluster).concat(state.allocs.map(a=>a.cluster))).map(p=>`<option>${esc(p)}</option>`).join("");
    if(pFilter&&!projs.includes(pFilter)) pFilter="";
    $("#projFilter").innerHTML=`<option value="">All projects</option>`+projs.map(p=>`<option ${p===pFilter?"selected":""}>${esc(p)}</option>`).join("");
  }
  function matches(j){
    if(pFilter&&j.proj!==pFilter) return false;
    if(sFilter==="active"&&!(j.status==="queued"||j.status==="running")) return false;
    if(sFilter!=="active"&&sFilter!=="all"&&j.status!==sFilter) return false;
    if(!query) return true;
    return [j.name,j.jobid,j.proj,j.cluster,j.soft,j.type,j.path,j.notes].join(" ").toLowerCase().includes(query);
  }
  function renderSummary(){
    const c=s=>state.jobs.filter(j=>j.status===s&&(!pFilter||j.proj===pFilter)).length;
    const now=Date.now();
    const att=state.jobs.filter(j=>(!pFilter||j.proj===pFilter)&&attention(j,jobInfo(j,now))).length;
    $("#summary").innerHTML=`<div class="sum"><b style="color:var(--s-running)">${c("running")}</b><span>Running</span></div>
      <div class="sum"><b style="color:var(--s-queued)">${c("queued")}</b><span>Queued</span></div>
      <div class="sum"><b style="color:var(--s-done)">${c("done")}</b><span>To analyse</span></div>
      <div class="sum"><b style="color:${att?"var(--danger)":"var(--muted)"}">${att}</b><span>Check</span></div>`;
  }
  function renderChips(){
    const base=state.jobs.filter(j=>!pFilter||j.proj===pFilter);
    const items=[{id:"active",name:"Active",n:base.filter(j=>j.status==="queued"||j.status==="running").length}]
      .concat(STATUS.map(s=>({id:s.id,name:s.name,n:base.filter(j=>j.status===s.id).length})))
      .concat([{id:"all",name:"All",n:base.length}]);
    $("#chips").innerHTML=items.map(i=>`<button class="chip" data-f="${i.id}" aria-pressed="${sFilter===i.id}">${i.name}<span class="c">${i.n}</span></button>`).join("");
  }
  function jobCard(j,now){
    const i=jobInfo(j,now); const st=STATUS.find(s=>s.id===j.status)||STATUS[0];
    const tags=[j.cluster,j.soft,j.type,j.jobid?`<span class="jid">#${esc(j.jobid)}</span>`:"",j.seg>1?`segment ${j.seg}`:"",
      j.nodes?`${j.nodes} node${j.nodes>1?"s":""}`:"",j.cores?`${j.cores} cores`:"",j.gpus?`${j.gpus} GPU${j.gpus>1?"s":""}`:""]
      .filter(Boolean).map(t=>t.startsWith("<")?t:esc(t));
    let prog="";
    if(i.pct!=null){
      prog=`<div class="prog" style="--sc:${sc(j.status)}"><div class="track"><div class="fill" style="width:${i.pct.toFixed(1)}%"></div></div>
      <div class="plab"><span>${i.est?"~":""}${fmtN(i.done)} / ${fmtN(j.target)} ${esc(j.unit||"")} (${i.pct.toFixed(0)}%)</span><span>${i.eta!=null?"ETA "+fmtDur(i.eta):""}</span></div></div>`;
    }
    let time="";
    if(j.status==="running"&&j.start){
      time=`<div class="plab" style="margin-top:8px"><span>Running ${fmtDur(i.elapsed)}</span>${i.left!=null?`<span class="${i.overdue?"warn":""}">${i.overdue?"Walltime passed, check it":"Walltime ends in "+fmtDur(i.left)}</span>`:""}</div>`;
    }else if(j.status==="queued"){
      time=`<div class="plab" style="margin-top:8px"><span>Submitted ${fmtDate(j.submitted||j.added)}</span></div>`;
    }else if(j.end){
      time=`<div class="plab" style="margin-top:8px"><span>${st.name} ${fmtDate(j.end)}</span>${i.coreh?`<span>${fmtN(i.coreh)} core-h${i.gpuh?", "+fmtN(i.gpuh)+" GPU-h":""}</span>`:""}</div>`;
    }
    const next={queued:["running","Start"],running:["done","Complete"],done:["analysed","Analysed"]}[j.status];
    return `<article class="job ${attention(j,i)?"attn":""}" data-id="${j.id}">
      <div class="top"><h3>${esc(j.name)}</h3><span class="pill" style="--sc:${sc(j.status)}">${st.name}</span></div>
      ${j.proj?`<div class="tags" style="color:var(--accent)">${esc(j.proj)}</div>`:""}
      ${tags.length?`<div class="tags">${tags.map(t=>`<span>${t}</span>`).join("")}</div>`:""}
      ${prog}${time}
      ${j.notes?`<div class="note">${esc(j.notes)}</div>`:""}
      <div class="acts">
        ${j.target&&(j.status==="running"||j.status==="queued")?`<button class="ibtn txt" data-act="progress">Update progress</button>`:""}
        ${next?`<button class="ibtn txt" data-act="next" data-to="${next[0]}">${next[1]}</button>`:""}
        ${j.path?`<button class="ibtn" data-act="copypath" aria-label="Copy path">⧉</button>`:""}
        <button class="ibtn" data-act="dup" aria-label="Duplicate as new segment">⎘</button>
        <button class="ibtn" data-act="edit" aria-label="Edit">✎</button>
      </div>
    </article>`;
  }
  function renderJobs(){
    refreshDatalists(); renderSummary(); renderChips();
    const now=Date.now();
    const order={running:0,queued:1,failed:2,done:3,analysed:4,cancelled:5};
    const list=state.jobs.filter(matches).sort((a,b)=>{
      const ia=attention(a,jobInfo(a,now)),ib=attention(b,jobInfo(b,now));
      return (ib-ia)||(order[a.status]-order[b.status])||((b.updated||0)-(a.updated||0));
    });
    $("#count").textContent=`${list.length} calculation${list.length===1?"":"s"}`;
    $("#jobs").innerHTML=list.length?list.map(j=>jobCard(j,now)).join("")
      :`<div class="empty">${state.jobs.length?"Nothing here with these filters.":"Tap + to log your first calculation."}</div>`;
  }

  // render allocations
  function allocCard(a,now){
    const pct=a.total?Math.min(100,(a.used||0)/a.total*100):0;
    const left=Math.max(0,(a.total||0)-(a.used||0));
    let lines=[];
    const start=a.start?new Date(a.start+"T00:00").getTime():null, end=a.end?new Date(a.end+"T23:59").getTime():null;
    if(end){
      const daysLeft=(end-now)/864e5;
      if(daysLeft<0) lines.push(`<span>Ended ${new Date(end).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span>`);
      else{
        lines.push(`<span>${Math.ceil(daysLeft)} days left</span>`);
        if(daysLeft>0&&left>0) lines.push(`<span>Needs ${fmtN(left/daysLeft)} ${esc(a.unit)}/day to use it all</span>`);
      }
      if(start&&now>start&&daysLeft>0&&a.total){
        const rate=(a.used||0)/((now-start)/864e5);
        const proj=(a.used||0)+rate*daysLeft;
        const ppct=proj/a.total*100;
        lines.push(`<span class="${ppct>100||ppct<70?"warn":""}">At current pace: ${ppct.toFixed(0)}% by the end${ppct>100?", runs out "+fmtDur((left/rate)*864e5)+" from now":""}</span>`);
      }
    }
    const col=pct>90?"var(--danger)":pct>70?"var(--s-queued)":"var(--accent)";
    const upd=a.usedAt?`<span>Usage updated ${fmtDate(a.usedAt)}</span>`:"";
    return `<article class="alloc" data-id="${a.id}">
      <div class="top"><h3>${esc(a.name)}</h3>${a.cluster?`<span class="pill" style="--sc:var(--muted)">${esc(a.cluster)}</span>`:""}</div>
      <div class="prog" style="--sc:${col}"><div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="plab"><span>${fmtN(a.used||0)} / ${fmtN(a.total||0)} ${esc(a.unit)} (${pct.toFixed(0)}%)</span><span>${fmtN(left)} left</span></div></div>
      <div class="tags" style="flex-direction:column;gap:2px;margin-top:8px">${lines.join("")}${upd}</div>
      ${a.notes?`<div class="note">${esc(a.notes)}</div>`:""}
      <div class="acts">
        <button class="ibtn txt" data-act="usage">Update usage</button>
        <button class="ibtn" data-act="edit" aria-label="Edit">✎</button>
      </div>
    </article>`;
  }
  function renderAllocs(){
    const now=Date.now();
    const list=[...state.allocs].sort((a,b)=>(a.end||"9").localeCompare(b.end||"9"));
    $("#allocs").innerHTML=list.length?list.map(a=>allocCard(a,now)).join("")
      :`<div class="empty">Tap + to add an allocation and track how fast you're using it.</div>`;
  }
  function render(){refreshDatalists();renderJobs();renderAllocs()}

  // tabs
  document.querySelector(".tabs").addEventListener("click",e=>{
    const t=e.target.closest(".tab"); if(!t) return;
    view=t.dataset.view;
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
    $("#jobsView").classList.toggle("hidden",view!=="jobs");
    $("#allocsView").classList.toggle("hidden",view!=="allocs");
    $("#fab").setAttribute("aria-label",view==="jobs"?"Add calculation":"Add allocation");
  });
  $("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;sFilter=b.dataset.f;renderJobs()});
  $("#projFilter").addEventListener("change",e=>{pFilter=e.target.value;renderJobs()});
  $("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();renderJobs()});
  document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
  document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
  $("#fab").addEventListener("click",()=>view==="jobs"?openJob():openAlloc());

  // job sheet
  const jdlg=$("#jdlg");
  function renderStatusPick(){
    $("#jStatus").innerHTML=STATUS.map(s=>`<button type="button" data-s="${s.id}" style="--sc:${sc(s.id)}" aria-pressed="${jStatus===s.id}">${s.name}</button>`).join("");
  }
  $("#jStatus").addEventListener("click",e=>{
    const b=e.target.closest("[data-s]"); if(!b) return;
    jStatus=b.dataset.s; renderStatusPick();
    if(jStatus==="running"&&!$("#jStart").value) $("#jStart").value=toLocalInput(Date.now());
  });
  function openJob(id,template){
    editingJob=id||null; $("#jHint").textContent="";
    const j=id?state.jobs.find(x=>x.id===id):template||null;
    $("#jTitle").textContent=id?"Edit calculation":template?"New segment":"New calculation";
    const f=(sel,v)=>$(sel).value=v??"";
    f("#jName",j?.name); f("#jProj",j?.proj||(pFilter||"")); f("#jCluster",j?.cluster); f("#jSoft",j?.soft); f("#jType",j?.type);
    f("#jId",id?j?.jobid:""); f("#jSeg",j?.seg); f("#jNodes",j?.nodes); f("#jCores",j?.cores); f("#jGpus",j?.gpus);
    f("#jStart",id?toLocalInput(j?.start):""); f("#jWall",j?.wall); f("#jDone",j?.done); f("#jTarget",j?.target);
    f("#jUnit",j?.unit); f("#jRate",j?.rate); f("#jPath",j?.path); f("#jNotes",id?j?.notes:"");
    jStatus=id?j.status:"queued"; renderStatusPick();
    $("#jDel").style.display=id?"":"none";
    jdlg.showModal(); if(!id&&!template) $("#jName").focus();
  }
  $("#jform").addEventListener("submit",e=>{
    e.preventDefault();
    const name=$("#jName").value.trim();
    if(!name){$("#jHint").textContent="Give the calculation a name.";$("#jName").focus();return}
    const startV=$("#jStart").value; const start=startV?new Date(startV).getTime():null;
    const prev=editingJob?state.jobs.find(x=>x.id===editingJob):null;
    const done=num($("#jDone").value);
    const now=Date.now();
    const data={name,status:jStatus,proj:$("#jProj").value.trim(),cluster:$("#jCluster").value.trim(),soft:$("#jSoft").value.trim(),
      type:$("#jType").value.trim(),jobid:$("#jId").value.trim(),seg:num($("#jSeg").value),nodes:num($("#jNodes").value),
      cores:num($("#jCores").value),gpus:num($("#jGpus").value),start:start||(jStatus==="running"?now:null),wall:num($("#jWall").value),
      done,target:num($("#jTarget").value),unit:$("#jUnit").value.trim(),rate:num($("#jRate").value),
      path:$("#jPath").value.trim(),notes:$("#jNotes").value.trim(),updated:now};
    if(!prev||prev.done!==done) data.doneAt=now;
    const ending=["done","failed","cancelled"].includes(jStatus);
    if(ending&&(!prev||!prev.end||prev.status!==jStatus)) data.end=prev&&prev.end&&["done","failed","cancelled","analysed"].includes(prev.status)?prev.end:now;
    if(!ending&&jStatus!=="analysed") data.end=null;
    if(prev) Object.assign(prev,data);
    else state.jobs.push({id:uid(),added:now,submitted:now,...data});
    persist(); render(); jdlg.close(); toast(prev?"Saved":"Calculation added");
  });
  $("#jDel").addEventListener("click",()=>{
    const j=state.jobs.find(x=>x.id===editingJob); if(!j) return;
    if(!confirm(`Delete "${j.name}"?`)) return;
    state.jobs=state.jobs.filter(x=>x.id!==editingJob); persist(); render(); jdlg.close(); toast("Deleted");
  });

  // job card actions
  const udlg=$("#udlg");
  $("#jobs").addEventListener("click",async e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const j=state.jobs.find(x=>x.id===b.closest(".job").dataset.id); if(!j) return;
    const a=b.dataset.act, now=Date.now();
    if(a==="edit") openJob(j.id);
    else if(a==="next"){
      const to=b.dataset.to;
      if(to==="running"){j.start=now}
      if(to==="done"){j.end=now; if(j.target&&j.rate&&j.doneAt){const i=jobInfo(j,now);j.done=+i.done.toFixed(3);j.doneAt=now}}
      j.status=to; j.updated=now; persist(); render(); toast("Marked "+STATUS.find(s=>s.id===to).name.toLowerCase());
    }
    else if(a==="dup"){
      const t={...j,seg:(j.seg||1)+1};
      if(j.target&&j.rate&&j.doneAt) t.done=+jobInfo(j,now).done.toFixed(3);
      openJob(null,t);
    }
    else if(a==="copypath"){
      try{await navigator.clipboard.writeText(j.path);toast("Path copied")}catch(_){toast("Copy not available")}
    }
    else if(a==="progress"){
      updating={kind:"job",id:j.id};
      $("#uTitle").textContent=j.name;
      $("#uLabel").firstChild.textContent=`Done so far (${j.unit||"units"}, target ${fmtN(j.target)})`;
      $("#uVal").value=j.status==="running"&&j.rate&&j.doneAt?+jobInfo(j,now).done.toFixed(2):(j.done??"");
      udlg.showModal(); $("#uVal").select();
    }
  });
  $("#uform").addEventListener("submit",e=>{
    e.preventDefault(); const v=num($("#uVal").value); if(v==null){udlg.close();return}
    const now=Date.now();
    if(updating.kind==="job"){
      const j=state.jobs.find(x=>x.id===updating.id);
      if(j){
        // refine rate from real progress when running
        if(j.status==="running"&&j.doneAt&&j.done!=null&&v>j.done){
          const days=(now-j.doneAt)/864e5; if(days>0.02) j.rate=+((v-j.done)/days).toFixed(3);
        }
        j.done=v;j.doneAt=now;j.updated=now;
      }
    }else{
      const a=state.allocs.find(x=>x.id===updating.id); if(a){a.used=v;a.usedAt=now}
    }
    persist(); render(); udlg.close(); toast("Updated");
  });

  // allocation sheet
  const adlg=$("#adlg");
  function openAlloc(id){
    editingAlloc=id||null; $("#aHint").textContent="";
    const a=id?state.allocs.find(x=>x.id===id):null;
    $("#aTitle").textContent=a?"Edit allocation":"New allocation";
    $("#aName").value=a?.name||""; $("#aCluster").value=a?.cluster||""; $("#aUnit").value=a?.unit||"CPU-h";
    $("#aTotal").value=a?.total??""; $("#aUsed").value=a?.used??""; $("#aStart").value=a?.start||""; $("#aEnd").value=a?.end||"";
    $("#aNotes").value=a?.notes||""; $("#aDel").style.display=a?"":"none";
    adlg.showModal(); if(!a) $("#aName").focus();
  }
  $("#aform").addEventListener("submit",e=>{
    e.preventDefault();
    const name=$("#aName").value.trim(), total=num($("#aTotal").value);
    if(!name){$("#aHint").textContent="Give the allocation a name.";return}
    if(!total){$("#aHint").textContent="Add the awarded hours.";return}
    if($("#aStart").value&&$("#aEnd").value&&$("#aEnd").value<$("#aStart").value){$("#aHint").textContent="The end date is before the start date.";return}
    const prev=editingAlloc?state.allocs.find(x=>x.id===editingAlloc):null;
    const used=num($("#aUsed").value)||0;
    const data={name,cluster:$("#aCluster").value.trim(),unit:$("#aUnit").value,total,used,start:$("#aStart").value,end:$("#aEnd").value,notes:$("#aNotes").value.trim()};
    if(!prev||prev.used!==used) data.usedAt=Date.now();
    if(prev) Object.assign(prev,data); else state.allocs.push({id:uid(),...data});
    persist(); render(); adlg.close(); toast(prev?"Saved":"Allocation added");
  });
  $("#aDel").addEventListener("click",()=>{
    const a=state.allocs.find(x=>x.id===editingAlloc); if(!a) return;
    if(!confirm(`Delete "${a.name}"?`)) return;
    state.allocs=state.allocs.filter(x=>x.id!==editingAlloc); persist(); render(); adlg.close(); toast("Deleted");
  });
  $("#allocs").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const a=state.allocs.find(x=>x.id===b.closest(".alloc").dataset.id); if(!a) return;
    if(b.dataset.act==="edit") openAlloc(a.id);
    else{
      updating={kind:"alloc",id:a.id}; $("#uTitle").textContent=a.name;
      $("#uLabel").firstChild.textContent=`Used so far (${a.unit} of ${fmtN(a.total)})`;
      $("#uVal").value=a.used??""; udlg.showModal(); $("#uVal").select();
    }
  });

  // menu
  const menu=$("#menu");
  function closeMenu(){menu.classList.remove("open");$("#moreBtn").setAttribute("aria-expanded","false")}
  $("#moreBtn").addEventListener("click",e=>{e.stopPropagation();const o=menu.classList.toggle("open");$("#moreBtn").setAttribute("aria-expanded",o)});
  document.addEventListener("click",e=>{if(!e.target.closest("#menu"))closeMenu()});
  $("#clearBtn").addEventListener("click",()=>{
    closeMenu(); const n=state.jobs.filter(j=>j.status==="analysed").length;
    if(!n){toast("No analysed jobs to remove");return}
    if(!confirm(`Remove ${n} analysed calculation${n===1?"":"s"}? Export a backup first if you want to keep a record.`)) return;
    state.jobs=state.jobs.filter(j=>j.status!=="analysed"); persist(); render(); toast("Removed");
  });
  function save(filename,data){offlineSave(filename,data)}
  const stamp=()=>new Date().toISOString().slice(0,10);
  $("#exportBtn").addEventListener("click",()=>{closeMenu();save(`hpc-${stamp()}.json`,JSON.stringify({version:1,exported:new Date().toISOString(),...state},null,2))});
  $("#csvBtn").addEventListener("click",()=>{
    closeMenu(); const now=Date.now();
    const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
    const cols=["name","status","project","cluster","software","type","job_id","segment","nodes","cores","gpus","started","ended","walltime_h","done","target","unit","rate_per_day","core_h","gpu_h","path","notes"];
    const rows=[cols.join(",")].concat(state.jobs.filter(matches).map(j=>{const i=jobInfo(j,now);return [j.name,j.status,j.proj,j.cluster,j.soft,j.type,j.jobid,j.seg,j.nodes,j.cores,j.gpus,
      j.start?new Date(j.start).toISOString():"",j.end?new Date(j.end).toISOString():"",j.wall,j.done,j.target,j.unit,j.rate,i.coreh?i.coreh.toFixed(1):"",i.gpuh?i.gpuh.toFixed(1):"",j.path,j.notes].map(q).join(",")}));
    save(`hpc-jobs-${stamp()}.csv`,rows.join("\n"));
  });
  $("#importBtn").addEventListener("click",()=>{closeMenu();$("#importFile").click()});
  $("#importFile").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const o=JSON.parse(await f.text()); if(!o||!Array.isArray(o.jobs)) throw 0;
      const jid=new Set(state.jobs.map(j=>j.id)), aid=new Set(state.allocs.map(a=>a.id)); let n=0;
      for(const j of o.jobs) if(j&&j.name&&!jid.has(j.id)){state.jobs.push({...j,id:j.id||uid()});n++}
      for(const a of (o.allocs||[])) if(a&&a.name&&!aid.has(a.id)){state.allocs.push({...a,id:a.id||uid()});n++}
      persist(); render(); toast(`Imported ${n} item${n===1?"":"s"}`);
    }catch(_){toast("Choose a .json backup exported from this tracker")}
    e.target.value="";
  });

  // boot
  const local=loadLocal(); if(local&&Array.isArray(local.jobs)) state={jobs:local.jobs,allocs:local.allocs||[]};
  render(); $("#sync").textContent=STORAGE_MSG();
  setInterval(()=>{if(!document.querySelector("dialog[open]"))render()},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!document.querySelector("dialog[open]"))render()});
})();
</script>
<script>window.__BACKUP={id:"hpc-tracker",key:"hpctracker.v1"};</script>
<script>
(function(){
  const C=window.__BACKUP, LK=C.id+".lastBackup", SK=C.id+".backupSnooze", WEEK=7*864e5;
  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};
  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};
  function hasData(){
    try{const v=JSON.parse(localStorage.getItem(C.key)||"null");if(!v)return false;
      if(Array.isArray(v))return v.length>0;
      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}
  }
  const bar=document.createElement("div");
  bar.className="bk hidden"; bar.setAttribute("role","status");
  bar.innerHTML='<div class="bkt"><b></b><span>A copy goes to your Downloads folder.</span></div><button class="bkno" type="button">Later</button><button class="bkgo" type="button">Back up now</button>';
  const wrap=document.querySelector(".wrap"), head=wrap&&wrap.querySelector(":scope > header");
  if(head) head.insertAdjacentElement("afterend",bar); else if(wrap) wrap.prepend(bar);
  function check(){
    const now=Date.now(), last=get(LK), data=hasData();
    // never backed up: start the 7-day clock from when data first appears
    if(!last&&data&&!get(C.id+".firstData")) set(C.id+".firstData",now);
    const ref=last||get(C.id+".firstData")||now;
    const due=data&&now-ref>WEEK&&now>get(SK);
    bar.classList.toggle("hidden",!due);
    if(due){
      const days=last?Math.floor((now-last)/864e5):0;
      bar.querySelector("b").textContent=last?`Last backup ${days} days ago`:"Not backed up yet";
    }
  }
  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};
  bar.querySelector(".bkgo").addEventListener("click",()=>{const b=document.getElementById("exportBtn");if(b)b.click()});
  bar.querySelector(".bkno").addEventListener("click",()=>{set(SK,Date.now()+864e5);check()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
  window.addEventListener("storage",check);
  setInterval(check,36e5);
  // first check after the app has loaded its data; recheck when data changes
  setTimeout(check,300);
  let t=null; document.addEventListener("click",()=>{clearTimeout(t);t=setTimeout(check,600)},true);
})();
</script>
