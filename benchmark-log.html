<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5A4360">
<meta name="color-scheme" content="dark">
<title>Benchmarks</title>
<style>
:root{
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  --bg:#14161B;--surface:#1C1F26;--raised:#242832;--ink:#E7E9EE;--muted:#8B919E;--faint:#2C303A;
  --accent:#9DB2FF;--danger:#F28B82;--gold:#E6C170;--green:#7DCB9C;--violet:#C3A6F0;--pink:#EE93AF;--teal:#8CC3CC;
  --font:"Manrope",system-ui,Roboto,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}
h1 .n{font-weight:400;color:var(--muted);font-size:1rem;margin-left:6px}
.hbtns{display:flex;gap:4px;position:relative}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);display:grid;place-items:center;font-size:1.1rem}
.ibtn:active{background:var(--surface)}
.menu{position:absolute;right:0;top:48px;background:var(--raised);border-radius:12px;padding:6px;min-width:200px;display:none;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}
.menu button:active{background:var(--faint)}
.search{width:100%;background:var(--surface);border:0;border-radius:12px;padding:12px 14px;min-height:48px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 14px;min-height:38px;color:var(--muted);background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .c{opacity:.7}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;color:var(--muted);font-size:.85rem;gap:8px}
.bar select{background:transparent;border:0;color:var(--muted);padding:6px 0;min-height:40px;max-width:60%}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:14px;padding:14px 10px 8px 16px}
.card h3{font-size:1rem;font-weight:500;margin:0;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:.82rem;color:var(--muted)}
.pill{flex:0 0 auto;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,transparent)}
.note{font-size:.88rem;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;justify-content:flex-end;margin-top:2px;flex-wrap:wrap}
.acts .ibtn{min-width:40px;min-height:40px;font-size:.95rem}
.acts .txt{font-size:.85rem;padding:0 10px;color:var(--accent)}
.star-on{color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--accent);color:#14161B;font-size:1.8rem;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:4}
dialog{border:0;padding:0;background:var(--raised);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh}
@media (min-width:600px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:1.15rem;font-weight:700}
.sheet h4{margin:6px 0 -4px;font-size:.8rem;font-weight:500;color:var(--accent)}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.sheet input,.sheet select,.sheet textarea{background:var(--surface);border:0;border-radius:12px;padding:12px;color:var(--ink);min-height:48px;width:100%;min-width:0}
.sheet textarea{min-height:90px;resize:vertical}
.mono{font-family:var(--mono)!important;font-size:.88rem!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:1rem!important}
.check input{min-height:auto!important;width:20px!important;height:20px;accent-color:var(--accent)}
.hint{font-size:.8rem;color:var(--danger);min-height:1em;margin:0}
.sbar{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.btn{border-radius:12px;padding:12px 16px;min-height:48px}
.btn.primary{background:var(--accent);color:#14161B;font-weight:700}
.btn.ghost{color:var(--muted)}
.btn.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:6}
.toast.show{opacity:1}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}
.sys{margin-top:18px}
.sys:first-child{margin-top:0}
.syshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 8px}
.syshead h2{font-size:1.05rem;font-weight:700;margin:0;overflow-wrap:anywhere}
.syshead span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.metric{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.metric b{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.metric span{color:var(--muted);font-size:.85rem}
.track{height:6px;background:var(--faint);border-radius:3px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--cc,var(--accent));border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stat{background:var(--bg);border-radius:10px;padding:8px}
.stat b{display:block;font-size:.95rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px}
.b-fast{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.b-cheap{color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.targetrow{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:0 2px 8px}
.targetrow input{width:90px;background:var(--surface);border:0;border-radius:10px;padding:8px 10px;min-height:40px;color:var(--ink)}
/* ---- Theme: dark with pink-to-blue accents ---- */
:root{
  --bg:#000000;--surface:#131316;--raised:#1D1D22;--ink:#F2F2F4;--muted:#9D9DA5;--faint:#28282E;
  --accent:#EBA8E4;--accent2:#A7CBF4;
  --grad:linear-gradient(90deg,#F0A8DC 0%,#C9B6EF 50%,#A6CCF5 100%);
  --danger:#EF5A50;--star:#EBA8E4;--pinbg:#2A2413;
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{background-color:#000;background-image:linear-gradient(172deg,#5A4360 0%,#352C3F 90px,#15121A 210px,#000 320px);background-repeat:no-repeat;background-size:100% 340px}
h1{font-weight:500;font-size:1.85rem;letter-spacing:0}
h1 .n{font-size:1rem}
.search{background:#0E0E11;border:1.5px solid #2E2E35;border-radius:999px}
.search:focus{border-color:#9C8BC0;outline:none}
.chip{background:#000;border:1.5px solid #3B3B43;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#17161C;font-weight:500}
.chip.add{color:var(--accent)}
.tab[aria-selected="true"]::after{background:var(--grad)}
.btn.primary,.add{background:var(--grad)!important;color:#17161C!important}
.fab{background:#17171C;border:1px solid #3A3A42;color:#D9B9EE;box-shadow:0 8px 22px rgba(0,0,0,.7)}
.star-on{color:var(--star)!important}
.card:has(.star-on),.paper:has(.star-on),.entry:has(.star-on){background:var(--pinbg)}
.menu{background:var(--raised);border:1px solid #2E2E35}
dialog{background:var(--raised)}
.sheet input,.sheet select,.sheet textarea,.dlg input,.dlg textarea,.dlg select{background:#0F0F12}
.toast{background:#26262C;color:var(--ink)}
.doi{color:var(--accent2)}
.sync{color:#6F6F77}
.seg button[aria-pressed="true"]{background:var(--grad);color:#17161C}
.topbar{background:linear-gradient(172deg,#5A4360 0%,#2A2432 100%)}
.toolbar{background:#000}
.bk.hidden{display:none!important}
.bk{display:flex;align-items:center;gap:8px;background:var(--pinbg,#2A2413);border-radius:14px;padding:10px 8px 10px 14px;margin:0 0 14px}
.bk .bkt{flex:1;min-width:0;font-size:.9rem;line-height:1.3}
.bk .bkt b{display:block;font-weight:500}
.bk .bkt span{color:var(--muted);font-size:.8rem}
.bk .bkgo{background:var(--grad);color:#17161C;border-radius:999px;padding:10px 14px;min-height:44px;font-weight:500;white-space:nowrap}
.bk .bkno{color:var(--muted);padding:10px 8px;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Benchmarks<span class="n" id="total"></span></h1>
    <div class="hbtns">
      <button class="ibtn" id="moreBtn" aria-label="More options" aria-expanded="false">⋮</button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="csvBtn">Export as CSV</button>
        <button role="menuitem" id="exportBtn">Export backup</button>
        <button role="menuitem" id="importBtn">Import backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>
  <label class="sr" for="search">Search benchmarks</label>
  <input class="search" id="search" type="search" placeholder="Search system, cluster, software, notes">
  <div class="chips" id="chips"></div>
  <div class="bar">
    <span id="count"></span>
    <label><span class="sr">Rank by</span><select id="rank">
      <option value="speed">Fastest first</option><option value="cost">Cheapest per ns first</option><option value="recent">Most recent first</option>
    </select></label>
  </div>
  <main id="list"></main>
  <p class="sync" id="sync"></p>
</div>
<button class="fab" id="fab" aria-label="Add benchmark">+</button>
<datalist id="dlSys"></datalist><datalist id="dlCluster"></datalist><datalist id="dlPart"></datalist>
<datalist id="dlSoft"><option>GROMACS</option><option>AMBER pmemd.cuda</option><option>AMBER pmemd.MPI</option><option>NAMD</option><option>OpenMM</option><option>LAMMPS</option><option>CP2K</option></datalist>

<dialog id="dlg">
  <form class="sheet" id="form" autocomplete="off" novalidate>
    <h2 id="dTitle">New benchmark</h2>
    <label>System<input id="fSys" list="dlSys" maxlength="80" placeholder="PETase on PET NP, 180k atoms"></label>
    <div class="row">
      <label>Atoms<input id="fAtoms" type="number" min="0" step="1" inputmode="numeric"></label>
      <label>Timestep (fs)<input id="fDt" type="number" min="0" step="any" inputmode="decimal"></label>
    </div>
    <div class="row">
      <label>Software<input id="fSoft" list="dlSoft" maxlength="40"></label>
      <label>Version<input id="fVer" maxlength="20" placeholder="2024.3"></label>
    </div>
    <div class="row">
      <label>Cluster<input id="fCluster" list="dlCluster" maxlength="40"></label>
      <label>Partition<input id="fPart" list="dlPart" maxlength="40"></label>
    </div>
    <h4>Resources</h4>
    <div class="row3">
      <label>Nodes<input id="fNodes" type="number" min="0" step="1" inputmode="numeric"></label>
      <label>Total cores<input id="fCores" type="number" min="0" step="1" inputmode="numeric"></label>
      <label>GPUs<input id="fGpus" type="number" min="0" step="1" inputmode="numeric"></label>
    </div>
    <div class="row">
      <label>MPI ranks<input id="fRanks" type="number" min="0" step="1" inputmode="numeric"></label>
      <label>OpenMP threads<input id="fOmp" type="number" min="0" step="1" inputmode="numeric"></label>
    </div>
    <h4>Result</h4>
    <div class="row">
      <label>Performance (ns/day)<input id="fPerf" type="number" min="0" step="any" inputmode="decimal"></label>
      <label>Date<input id="fDate" type="date"></label>
    </div>
    <label>Flags or settings<input id="fFlags" class="mono" maxlength="300" autocapitalize="off" spellcheck="false" placeholder="-nb gpu -pme gpu -bonded gpu -update gpu"></label>
    <label>Notes<textarea id="fNotes" maxlength="1500"></textarea></label>
    <p class="hint" id="hint"></p>
    <div class="sbar">
      <button type="button" class="btn danger" id="delBtn">Delete</button>
      <span style="display:flex;gap:6px;margin-left:auto">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const stamp=()=>new Date().toISOString().slice(0,10);
let _tt=null;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove("show"),2400)}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg||"Copied")}
  catch(_){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");toast(msg||"Copied")}catch(__){toast("Copy not available")}a.remove()}
}
function storageWorks(){try{const k="__probe"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(_){return false}}
function saveFile(filename,data){
  try{
    const ext=(filename.split(".").pop()||"").toLowerCase();
    const type={json:"application/json",csv:"text/csv",md:"text/markdown",py:"text/x-python",sh:"text/x-shellscript",png:"image/png"}[ext]||"text/plain";
    const blob=data instanceof Blob?data:new Blob([data],{type:type+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;a.style.display="none";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast("Saved to Downloads");if(/\.json$/i.test(filename)&&window.__markBackup)window.__markBackup();
  }catch(_){toast("Couldn't save the file")}
}
function setupMenu(){
  const menu=$("#menu"),btn=$("#moreBtn");
  const close=()=>{menu.classList.remove("open");btn.setAttribute("aria-expanded","false")};
  btn.addEventListener("click",e=>{e.stopPropagation();btn.setAttribute("aria-expanded",menu.classList.toggle("open"))});
  document.addEventListener("click",e=>{if(!e.target.closest("#menu"))close()});
  menu.addEventListener("click",close);
  document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
  document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
}
// Store: kept in this browser's local storage only.
function makeStore(lsKey,docName,listKeys,onChange){
  const S={data:null};
  try{const r=localStorage.getItem(lsKey);S.data=r?JSON.parse(r):null}catch(_){}
  if(!S.data||typeof S.data!=="object") S.data={};
  listKeys.forEach(k=>{if(!Array.isArray(S.data[k]))S.data[k]=[]});
  S.saveLocal=()=>{try{localStorage.setItem(lsKey,JSON.stringify(S.data))}catch(_){toast("Couldn't save. Storage is full or blocked; export a backup.")}};
  S.persist=()=>S.saveLocal();
  S.connect=()=>{
    $("#sync").textContent=storageWorks()?"Saved on this phone. Export a backup now and then.":"Storage is blocked here, so changes will be lost when you close this page.";
  };
  return S;
}

(function(){
  let sysFilter="",query="",rank="speed",editing=null;
  const store=makeStore("benchlog.v1","benchmarks",["runs"],render);
  const D=()=>store.data;
  if(!D().targets||typeof D().targets!=="object") D().targets={};
  const f2=n=>n==null||!isFinite(n)?"-":n>=100?Math.round(n).toLocaleString("en-GB"):(+n.toPrecision(3)).toLocaleString("en-GB");

  // cost: resource-hours to simulate 1 ns
  function derive(r){
    const p=r.perf||0, o={};
    if(p>0){
      if(r.gpus) o.gpuh=r.gpus*24/p;
      if(r.cores) o.coreh=r.cores*24/p;
      if(r.nodes) o.nodeh=r.nodes*24/p, o.perNode=p/r.nodes;
      if(r.gpus) o.perGpu=p/r.gpus;
    }
    return o;
  }
  const costOf=r=>{const d=derive(r);return d.gpuh??d.coreh??d.nodeh??Infinity};
  const costLabel=r=>{const d=derive(r);return d.gpuh!=null?[d.gpuh,"GPU-h/ns"]:d.coreh!=null?[d.coreh,"core-h/ns"]:d.nodeh!=null?[d.nodeh,"node-h/ns"]:[null,"per ns"]};

  function refreshLists(){
    const u=k=>[...new Set(D().runs.map(r=>r[k]).filter(Boolean))].sort();
    $("#dlSys").innerHTML=u("sys").map(v=>`<option>${esc(v)}</option>`).join("");
    $("#dlCluster").innerHTML=u("cluster").map(v=>`<option>${esc(v)}</option>`).join("");
    $("#dlPart").innerHTML=u("part").map(v=>`<option>${esc(v)}</option>`).join("");
  }
  function render(){
    refreshLists();
    const R=D().runs, systems=[...new Set(R.map(r=>r.sys))].sort((a,b)=>a.localeCompare(b));
    if(sysFilter&&!systems.includes(sysFilter)) sysFilter="";
    $("#total").textContent=R.length||"";
    $("#chips").innerHTML=[`<button class="chip" data-f="" aria-pressed="${!sysFilter}">All systems<span class="c">${R.length}</span></button>`]
      .concat(systems.map(s=>`<button class="chip" data-f="${esc(s)}" aria-pressed="${sysFilter===s}">${esc(s)}<span class="c">${R.filter(r=>r.sys===s).length}</span></button>`)).join("");
    const vis=R.filter(r=>(!sysFilter||r.sys===sysFilter)&&(!query||[r.sys,r.soft,r.ver,r.cluster,r.part,r.flags,r.notes].join(" ").toLowerCase().includes(query)));
    $("#count").textContent=`${vis.length} run${vis.length===1?"":"s"}`;
    if(!vis.length){$("#list").innerHTML=`<div class="empty">${R.length?"No runs match.":"Tap + to log your first benchmark. Grab ns/day from the end of the log file."}</div>`;return}
    const groups=[...new Set(vis.map(r=>r.sys))].sort((a,b)=>a.localeCompare(b));
    $("#list").innerHTML=groups.map(s=>{
      const rs=vis.filter(r=>r.sys===s), all=R.filter(r=>r.sys===s);
      const best=Math.max(...all.map(r=>r.perf||0));
      const fastest=all.reduce((a,b)=>(b.perf||0)>(a.perf||0)?b:a);
      const cheapest=all.filter(r=>isFinite(costOf(r))).reduce((a,b)=>!a||costOf(b)<costOf(a)?b:a,null);
      const sorted=[...rs].sort(rank==="speed"?(a,b)=>(b.perf||0)-(a.perf||0):rank==="cost"?(a,b)=>costOf(a)-costOf(b):(a,b)=>(b.date||"").localeCompare(a.date||"")||b.added-a.added);
      const tgt=D().targets[s]||"";
      const atoms=all.find(r=>r.atoms)?.atoms;
      return `<section class="sys">
        <div class="syshead"><h2>${esc(s)}</h2><span>${atoms?Number(atoms).toLocaleString("en-GB")+" atoms":""}</span></div>
        <div class="targetrow"><label for="t-${esc(s)}">Plan a run of</label><input id="t-${esc(s)}" data-target="${esc(s)}" type="number" min="0" step="any" inputmode="decimal" value="${esc(tgt)}" placeholder="ns"><span>ns</span></div>
        <div class="list">${sorted.map(r=>{
          const d=derive(r), [cv,cu]=costLabel(r), pct=best?((r.perf||0)/best*100):0;
          const res=[r.nodes?`${r.nodes} node${r.nodes>1?"s":""}`:"",r.cores?`${r.cores} cores`:"",r.gpus?`${r.gpus} GPU${r.gpus>1?"s":""}`:"",r.ranks?`${r.ranks} ranks`:"",r.omp?`${r.omp} threads`:""].filter(Boolean);
          const days=tgt&&r.perf?tgt/r.perf:null;
          return `<article class="card" data-id="${r.id}">
            <div class="top"><div class="tags" style="margin:0">${[r.cluster,r.part,[r.soft,r.ver].filter(Boolean).join(" ")].filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
              <span>${r===fastest&&all.length>1?`<span class="badge b-fast">Fastest</span>`:""}${r===cheapest&&all.length>1?`<span class="badge b-cheap">Cheapest</span>`:""}</span></div>
            <div class="metric"><b>${f2(r.perf)}</b><span>ns/day</span></div>
            <div class="track" style="--cc:${r===fastest?"var(--green)":"var(--accent)"}"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
            ${res.length?`<div class="tags">${res.map(t=>`<span>${t}</span>`).join("")}</div>`:""}
            <div class="stats">
              <div class="stat"><b>${f2(cv)}</b><span>${cu}</span></div>
              <div class="stat"><b>${d.perGpu!=null?f2(d.perGpu):f2(d.perNode)}</b><span>${d.perGpu!=null?"ns/day per GPU":"ns/day per node"}</span></div>
              <div class="stat"><b>${days!=null?(days<1?f2(days*24)+" h":f2(days)+" d"):"-"}</b><span>${days!=null?`wall time for ${f2(+tgt)} ns`:"set a target above"}</span></div>
            </div>
            ${days!=null&&isFinite(cv)?`<div class="tags"><span>Total cost for ${f2(+tgt)} ns: ${f2(cv*tgt)} ${cu.replace("/ns","")}</span></div>`:""}
            ${r.flags?`<div class="note" style="font-family:var(--mono);font-size:.8rem">${esc(r.flags)}</div>`:""}
            ${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}
            <div class="acts">
              <span style="margin-right:auto;align-self:center;font-size:.78rem;color:var(--muted)">${r.dt?r.dt+" fs, ":""}${r.date?new Date(r.date+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):""}</span>
              <button class="ibtn" data-act="dup" aria-label="Duplicate to try another setup">⎘</button>
              <button class="ibtn" data-act="edit" aria-label="Edit">✎</button>
            </div></article>`;}).join("")}</div></section>`;
    }).join("");
  }

  $("#list").addEventListener("change",e=>{
    const t=e.target.closest("[data-target]"); if(!t) return;
    const v=num(t.value); if(v) D().targets[t.dataset.target]=v; else delete D().targets[t.dataset.target];
    store.persist(); render();
  });
  $("#list").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const r=D().runs.find(x=>x.id===b.closest(".card").dataset.id); if(!r) return;
    if(b.dataset.act==="edit") openEdit(r.id); else openEdit(null,r);
  });

  const dlg=$("#dlg");
  const F=["sys","atoms","dt","soft","ver","cluster","part","nodes","cores","gpus","ranks","omp","perf","date","flags","notes"];
  const el=k=>$("#f"+k[0].toUpperCase()+k.slice(1));
  const NUMS=["atoms","dt","nodes","cores","gpus","ranks","omp","perf"];
  function openEdit(id,tpl){
    editing=id||null; $("#hint").textContent="";
    const r=id?D().runs.find(x=>x.id===id):tpl||null;
    $("#dTitle").textContent=id?"Edit benchmark":tpl?"Try another setup":"New benchmark";
    F.forEach(k=>el(k).value=r?.[k]??"");
    if(!id){ if(!r&&sysFilter) el("sys").value=sysFilter; el("perf").value=""; el("date").value=stamp(); if(tpl) el("notes").value=""; }
    $("#delBtn").style.display=id?"":"none"; dlg.showModal(); if(!r) el("sys").focus();
  }
  $("#fab").addEventListener("click",()=>openEdit());
  $("#form").addEventListener("submit",e=>{
    e.preventDefault();
    const d={}; F.forEach(k=>d[k]=NUMS.includes(k)?num(el(k).value):el(k).value.trim());
    if(!d.sys){$("#hint").textContent="Name the system.";return}
    if(!d.perf){$("#hint").textContent="Add the performance in ns/day.";return}
    if(!d.cores&&!d.gpus&&!d.nodes){$("#hint").textContent="Add nodes, cores or GPUs so the cost per ns can be worked out.";return}
    d.updated=Date.now();
    const r=editing?D().runs.find(x=>x.id===editing):null;
    if(r) Object.assign(r,d); else D().runs.push({id:uid(),added:Date.now(),...d});
    sysFilter=sysFilter&&sysFilter!==d.sys?d.sys:sysFilter;
    store.persist(); render(); dlg.close(); toast(r?"Saved":"Benchmark added");
  });
  $("#delBtn").addEventListener("click",()=>{
    if(!confirm("Delete this benchmark?")) return;
    D().runs=D().runs.filter(x=>x.id!==editing); store.persist(); render(); dlg.close(); toast("Deleted");
  });

  $("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
  $("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;sysFilter=b.dataset.f;render()});
  $("#rank").addEventListener("change",e=>{rank=e.target.value;render()});

  $("#csvBtn").addEventListener("click",()=>{
    const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
    const cols=["system","atoms","timestep_fs","software","version","cluster","partition","nodes","cores","gpus","mpi_ranks","omp_threads","ns_per_day","core_h_per_ns","gpu_h_per_ns","date","flags","notes"];
    const rows=[cols.join(",")].concat(D().runs.map(r=>{const d=derive(r);return [r.sys,r.atoms,r.dt,r.soft,r.ver,r.cluster,r.part,r.nodes,r.cores,r.gpus,r.ranks,r.omp,r.perf,d.coreh?.toFixed(3),d.gpuh?.toFixed(3),r.date,r.flags,r.notes].map(q).join(",")}));
    saveFile(`benchmarks-${stamp()}.csv`,rows.join("\n"));
  });
  $("#exportBtn").addEventListener("click",()=>saveFile(`benchmarks-${stamp()}.json`,JSON.stringify({version:1,exported:new Date().toISOString(),runs:D().runs,targets:D().targets},null,2)));
  $("#importBtn").addEventListener("click",()=>$("#importFile").click());
  $("#importFile").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{const o=JSON.parse(await f.text()); if(!Array.isArray(o.runs)) throw 0;
      const ids=new Set(D().runs.map(r=>r.id)); let n=0;
      for(const r of o.runs) if(r&&r.sys&&!ids.has(r.id)){D().runs.push({...r,id:r.id||uid(),updated:Date.now()});n++}
      Object.assign(D().targets,o.targets||{});
      store.persist(); render(); toast(`Imported ${n} run${n===1?"":"s"}`);
    }catch(_){toast("Choose a .json backup exported from this log")}
    e.target.value="";
  });

  setupMenu(); render(); store.connect();
})();
</script>
<script>window.__BACKUP={id:"benchmark-log",key:"benchlog.v1"};</script>
<script>
(function(){
  const C=window.__BACKUP, LK=C.id+".lastBackup", SK=C.id+".backupSnooze", WEEK=7*864e5;
  const get=k=>{try{return +localStorage.getItem(k)||0}catch(_){return 0}};
  const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(_){}};
  function hasData(){
    try{const v=JSON.parse(localStorage.getItem(C.key)||"null");if(!v)return false;
      if(Array.isArray(v))return v.length>0;
      return Object.values(v).some(x=>Array.isArray(x)&&x.length>0)}catch(_){return false}
  }
  const bar=document.createElement("div");
  bar.className="bk hidden"; bar.setAttribute("role","status");
  bar.innerHTML='<div class="bkt"><b></b><span>A copy goes to your Downloads folder.</span></div><button class="bkno" type="button">Later</button><button class="bkgo" type="button">Back up now</button>';
  const wrap=document.querySelector(".wrap"), head=wrap&&wrap.querySelector(":scope > header");
  if(head) head.insertAdjacentElement("afterend",bar); else if(wrap) wrap.prepend(bar);
  function check(){
    const now=Date.now(), last=get(LK), data=hasData();
    // never backed up: start the 7-day clock from when data first appears
    if(!last&&data&&!get(C.id+".firstData")) set(C.id+".firstData",now);
    const ref=last||get(C.id+".firstData")||now;
    const due=data&&now-ref>WEEK&&now>get(SK);
    bar.classList.toggle("hidden",!due);
    if(due){
      const days=last?Math.floor((now-last)/864e5):0;
      bar.querySelector("b").textContent=last?`Last backup ${days} days ago`:"Not backed up yet";
    }
  }
  window.__markBackup=()=>{set(LK,Date.now());set(SK,0);check()};
  bar.querySelector(".bkgo").addEventListener("click",()=>{const b=document.getElementById("exportBtn");if(b)b.click()});
  bar.querySelector(".bkno").addEventListener("click",()=>{set(SK,Date.now()+864e5);check()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
  window.addEventListener("storage",check);
  setInterval(check,36e5);
  // first check after the app has loaded its data; recheck when data changes
  setTimeout(check,300);
  let t=null; document.addEventListener("click",()=>{clearTimeout(t);t=setTimeout(check,600)},true);
})();
</script>
